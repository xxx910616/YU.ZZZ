<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YU.ZZZ OFFICIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* 顏色調整 */
            --bg-gray: #F5F5F3;           /* 淺杏灰背景 */
            --soft-blue: #F0F4F7;         /* 淺藍灰底色 */
            --deep-navy: #5b7189;         /* 指定的深藍色 #5b7189 */
            --pure-white: #FFFFFF;        /* 純白 */
            --highlight-yellow: #E9C46A;  /* 莫蘭迪金黃 */
            --list-light-yellow: #F9F7ED; /* 清單底色：淺米黃 */
            --brand-blue: #5b7189;        /* 品牌色 */
            --item-border: #E8E6E0;       /* 邊框色 */
            
            /* 輔助色 */
            --morandi-red: #D67A6B;       /* 莫蘭迪磚紅 */
            --morandi-green: #81B29A;     /* 莫蘭迪鼠尾草綠 */
            --morandi-blue: #8E9AAF;      /* 莫蘭迪淺藍 */
            --text-grey: #5E6472;         /* 深灰文字 */
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-gray); 
            color: var(--brand-blue);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .color-brand-custom { color: var(--deep-navy); }
        .bg-brand-custom { background-color: var(--deep-navy); }
        .color-yellow-main { color: var(--highlight-yellow); }

        input::-webkit-outer-spin-button, 
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* 歷史清單卡片樣式 */
        .history-card {
            transition: all 0.3s ease;
            background-color: var(--pure-white);
        }
        
        /* 展開動畫 */
        .detail-panel { 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease, padding 0.3s ease;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
        }
        
        .history-card.expanded .detail-panel { 
            max-height: 1000px; 
            opacity: 1;
            padding-top: 1.5rem; 
            padding-bottom: 1.5rem; 
        }
        .history-card.expanded .chevron { transform: rotate(180deg); }
        
        .history-card:not(.expanded) .card-header {
            padding-bottom: 1rem;
        }

        /* 重量按鈕 active 樣式 */
        .weight-btn.active {
            background-color: var(--deep-navy) !important; 
            color: var(--pure-white) !important;
            border-color: var(--deep-navy) !important;
            box-shadow: 0 4px 6px rgba(91, 113, 137, 0.2);
        }
        
        /* 詳細資料圓角框 */
        .stat-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            border: 1px solid var(--item-border);
            margin-bottom: 8px;
        }

        .list-container {
            background-color: var(--list-light-yellow); 
            border-top: 1px solid var(--item-border);
        }

        #imageModal { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
        
        .active-scale:active { transform: scale(0.98); opacity: 0.9; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-md mx-auto min-h-screen flex flex-col relative no-scrollbar">
        <!-- Header -->
        <div class="p-6 pb-8 bg-[var(--pure-white)] sticky top-0 z-40 shadow-sm border-b border-[#E8E6E0] rounded-b-[2.5rem]">
            <div class="flex justify-between items-start mb-6">
                <div class="flex flex-col">
                    <h1 class="text-5xl font-black color-brand-custom italic tracking-tighter leading-none">YU.ZZZ</h1>
                    <span class="text-[10px] font-black text-[#5E6472] tracking-[0.3em] mt-1 ml-1 uppercase">Official｜2 0 0 2</span>
                </div>
                <div class="text-right flex flex-col justify-center">
                    <p class="text-[10px] text-[#A5A5A5] font-black uppercase tracking-widest mb-1">Total Profit</p>
                    <p class="text-4xl font-black color-yellow-main italic leading-none">$<span id="totalProfit">0</span></p>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[var(--soft-blue)] p-3 rounded-2xl border border-[#DDE1E4]">
                    <p class="text-[9px] text-[var(--text-grey)] font-bold uppercase mb-1">Exchange Rate</p>
                    <div class="flex items-center justify-between">
                        <p id="currentRateDisplay" class="text-lg font-mono font-bold text-[var(--deep-navy)]">0.0240</p>
                        <button id="syncBtn" class="p-2 bg-white text-[var(--deep-navy)] rounded-xl active-scale shadow-sm">
                            <svg id="syncIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="bg-[var(--soft-blue)] p-3 rounded-2xl border border-[#DDE1E4]">
                    <p class="text-[9px] text-[var(--text-grey)] font-bold mb-1 uppercase">Bank Fee %</p>
                    <div class="flex items-center gap-1">
                        <input type="number" id="bankFeeInput" value="1.5" class="w-full bg-transparent text-lg font-black text-[var(--deep-navy)] outline-none">
                        <span class="text-lg font-black text-[var(--deep-navy)]">%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Fields -->
        <div class="px-6 py-5 space-y-5">
            <div class="grid grid-cols-3 gap-2.5">
                <div>
                    <label class="text-[9px] font-black text-[#A5A5A5] uppercase ml-1">Currency</label>
                    <select id="currency" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none shadow-sm text-[#5E6472]">
                        <option value="KRW">KRW 🇰🇷</option>
                        <option value="JPY">JPY 🇯🇵</option>
                    </select>
                </div>
                <div>
                    <label class="text-[9px] font-black text-[#A5A5A5] uppercase ml-1">Profit %</label>
                    <input type="number" id="profitPercent" value="12" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none text-[#5E6472]">
                </div>
                <div>
                    <label class="text-[9px] font-black text-[#A5A5A5] uppercase ml-1">Extra cost</label>
                    <input type="number" id="manualCost" value="0" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none text-[#5E6472]">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[9px] font-black text-[#A5A5A5] uppercase tracking-widest">Weight Range</label>
                <div class="grid grid-cols-2 gap-2" id="weightBtnContainer">
                    <button data-tier="0" data-label="2kg 以下" class="weight-btn active border bg-white p-3 rounded-xl text-[10px] font-black border-gray-200">2kg 以下 (+0)</button>
                    <button data-tier="2-5" data-label="2-5kg" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black">2-5kg (+60)</button>
                    <button data-tier="5-10" data-label="5-10kg" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black">5-10kg (+100)</button>
                    <button data-tier="10+" data-label="10kg+" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black">10kg+ (+150)</button>
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[9px] font-black text-[#A5A5A5] uppercase tracking-widest">Product Name</label>
                <div class="flex gap-2">
                    <input type="text" id="itemName" placeholder="輸入產品名稱..." class="w-full p-4 bg-white border border-gray-200 rounded-xl text-sm font-bold outline-none shadow-sm">
                    <button id="cameraBtn" class="px-5 bg-brand-custom text-white rounded-xl active-scale flex items-center justify-center shadow-md">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812-1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                    </button>
                    <input type="file" id="hiddenCameraInput" accept="image/*" capture="environment" class="hidden">
                </div>
                <div id="photoPreviewContainer" class="hidden flex justify-center pt-2">
                    <div class="relative">
                        <img id="photoPreviewImg" src="" class="w-20 h-20 object-cover rounded-xl border-2 border-white shadow-lg">
                        <button id="clearPhotoBtn" class="absolute -top-2 -right-2 bg-[var(--morandi-red)] text-white rounded-full p-1 shadow-md">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Calculator Result -->
        <div class="px-6 pb-8 space-y-4">
            <div class="space-y-1">
                <label class="text-[10px] uppercase font-black text-[#A5A5A5] italic block pl-2">Local Original Price</label>
                <div class="relative">
                    <input type="number" inputmode="decimal" id="foreignPrice" placeholder="0" class="w-full p-6 pr-24 text-5xl font-black rounded-[2rem] outline-none bg-white border-2 border-[#EAE7E1] shadow-inner text-[var(--deep-navy)]">
                    <span id="priceSuffix" class="absolute right-8 top-1/2 -translate-y-1/2 font-black text-gray-200 text-2xl italic pointer-events-none uppercase">KRW</span>
                </div>
            </div>

            <div class="bg-black rounded-[2.5rem] p-7 text-white shadow-2xl relative z-10 border border-black">
                <div class="flex justify-between items-center mb-5">
                    <div>
                        <p class="text-[9px] text-[var(--highlight-yellow)] font-bold uppercase tracking-widest">Suggested Price</p>
                        <p id="finalPrice" class="text-5xl font-black mt-1">$ 0</p>
                    </div>
                    <div class="text-right space-y-1">
                        <p class="text-[10px] font-bold text-[var(--morandi-red)] italic">Fee: <span id="resExtra">-$0</span></p>
                        <p class="text-[10px] font-bold text-[var(--morandi-green)] italic">Profit: <span id="resProfit">+$0</span></p>
                        <p class="text-[10px] font-bold text-[#D5D1C5] italic">Cost: <span id="resOriginal">+$0</span></p>
                    </div>
                </div>
                <button id="addToListBtn" class="w-full py-4 bg-[var(--highlight-yellow)] text-black font-black text-lg rounded-2xl active-scale uppercase tracking-widest shadow-lg">ADD TO LIST</button>
            </div>
        </div>

        <!-- List Section -->
        <div class="list-container p-6 rounded-t-[3rem] flex-grow min-h-[500px]">
            <div class="flex items-center gap-3 mb-6">
                <h2 class="text-[10px] font-black text-[var(--brand-blue)]/50 uppercase italic whitespace-nowrap">LIST</h2>
                <input type="text" id="searchHistory" placeholder="Search..." class="w-full py-2 px-4 bg-white/70 border border-[#E8E6E0] rounded-xl text-[10px] font-bold outline-none shadow-sm backdrop-blur-sm">
                <button id="exportCsvBtn" class="px-4 py-2 bg-white text-[var(--morandi-green)] text-[10px] font-black rounded-xl border border-[#E8E6E0] shadow-sm uppercase">CSV</button>
            </div>
            <div id="historyList" class="space-y-4"></div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" onclick="this.style.display='none'">
        <img id="fullImage" src="" class="max-w-[90%] max-h-[80vh] rounded-3xl shadow-2xl">
    </div>

    <script>
        const STORAGE_KEY = 'yu_zzz_history_data';
        let historyData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let exchangeRates = { KRW: 0.0240, JPY: 0.210 };
        let currentWeightTier = "0";
        let currentWeightLabel = "2kg 以下";
        let capturedImageData = null;

        const taxRefundTable = [
            { min: 30000, max: 49999, refund: 1500 }, { min: 50000, max: 74999, refund: 3000 },
            { min: 75000, max: 99999, refund: 5000 }, { min: 100000, max: 124999, refund: 6000 },
            { min: 125000, max: 149999, refund: 8000 }, { min: 150000, max: 174999, refund: 9000 },
            { min: 175000, max: 199999, refund: 10000 }, { min: 200000, max: 224999, refund: 12000 },
            { min: 225000, max: 249999, refund: 13000 }, { min: 250000, max: 274999, refund: 15000 },
            { min: 275000, max: 299999, refund: 17000 }, { min: 300000, max: 499999, refund: 20000 },
            { min: 500000, max: 999999, refund: 35000 }
        ];

        function calculate() {
            const currency = document.getElementById('currency').value;
            const rate = exchangeRates[currency] || 0.024;
            const bankFee = (parseFloat(document.getElementById('bankFeeInput').value) || 1.5) / 100;
            const profitP = (parseFloat(document.getElementById('profitPercent').value) || 12) / 100;
            const foreign = parseFloat(document.getElementById('foreignPrice').value) || 0;
            const manual = parseFloat(document.getElementById('manualCost').value) || 0;

            document.getElementById('priceSuffix').innerText = currency;

            if (foreign <= 0) {
                document.getElementById('finalPrice').innerText = "$ 0";
                document.getElementById('resOriginal').innerText = "-$0";
                document.getElementById('resExtra').innerText = "-$0";
                document.getElementById('resProfit').innerText = "+$0";
                return null;
            }

            let weightExtra = 0;
            if (currentWeightTier === "2-5") weightExtra = 60;
            else if (currentWeightTier === "5-10") weightExtra = 100;
            else if (currentWeightTier === "10+") weightExtra = 150;

            const costTwd = foreign * rate;
            
            // 修正計算邏輯：手續費 = TWD 成本 * 1.5% (bankFee)
            const fee = Math.round(costTwd * bankFee);
            
            // 建議售價計算 (公式包含獲利與重量加價)
            const target = (costTwd / (1 - bankFee - profitP)) + weightExtra;
            const final = Math.round(target);
            
            let refundTwd = 0;
            if (currency === 'KRW') {
                const tr = taxRefundTable.find(t => foreign >= t.min && foreign <= t.max);
                const refundKrw = tr ? tr.refund : (foreign >= 1000000 ? foreign * 0.06 : 0);
                refundTwd = Math.round(refundKrw * rate);
            }

            // 最終利潤計算
            const profit = final - costTwd - fee - manual + refundTwd;

            document.getElementById('finalPrice').innerText = `$ ${final.toLocaleString()}`;
            document.getElementById('resOriginal').innerText = `+$${Math.round(costTwd).toLocaleString()}`;
            document.getElementById('resExtra').innerText = `-$${fee.toLocaleString()}`;
            document.getElementById('resProfit').innerText = `+$${Math.round(profit).toLocaleString()}`;

            const now = new Date();
            return {
                id: Date.now().toString(),
                date: `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`,
                time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
                name: document.getElementById('itemName').value || '未命名商品',
                image: capturedImageData,
                currency, foreign, bankRate: rate,
                rawTwdCost: Math.round(costTwd), weightLabel: currentWeightLabel,
                weightTier: currentWeightTier, refundTwd, finalPrice: final, netProfit: profit, manualCost: manual, fee
            };
        }

        async function syncRates() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/TWD');
                const data = await res.json();
                if (data.result === 'success') {
                    exchangeRates.KRW = 1 / data.rates.KRW;
                    exchangeRates.JPY = 1 / data.rates.JPY;
                    document.getElementById('currentRateDisplay').innerText = (exchangeRates[document.getElementById('currency').value]).toFixed(4);
                    calculate();
                }
            } catch (e) { console.error("匯率更新失敗", e); }
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(historyData));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const search = (document.getElementById('searchHistory').value || '').toLowerCase();
            list.innerHTML = '';
            let totalProfitSum = 0;

            const tierStyles = {
                "0": "bg-gray-100 text-gray-500",
                "2-5": "bg-green-50 text-green-600",
                "5-10": "bg-[#F4EBE2] text-[#8B4513]",
                "10+": "bg-red-50 text-red-500"
            };

            historyData.filter(i => (i.name||'').toLowerCase().includes(search)).forEach(item => {
                totalProfitSum += (item.netProfit || 0);
                const el = document.createElement('div');
                el.className = 'history-card rounded-3xl shadow-sm border border-[var(--item-border)] overflow-hidden mb-3';
                
                const currentTierStyle = tierStyles[item.weightTier] || tierStyles["0"];

                el.innerHTML = `
                    <div class="p-5 flex items-center justify-between card-header cursor-pointer active-scale relative z-10">
                        <div class="flex items-center gap-4">
                            <div class="chevron transition-transform text-[#B7B7A4] text-xs">▼</div>
                            <div>
                                <h3 class="font-black text-base text-[var(--brand-blue)]">${item.name}</h3>
                                <p class="text-[10px] text-[#A3B18A] font-bold uppercase">
                                    ${item.foreign.toLocaleString()} ${item.currency} · RATE ${item.bankRate.toFixed(4)}
                                </p>
                                <p class="text-[9px] text-[#A5A5A5] font-bold uppercase tracking-wider mt-0.5">
                                    ${item.date} ${item.time}
                                </p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-right">
                                <p class="text-xl font-black italic text-[var(--brand-blue)]">$${item.finalPrice.toLocaleString()}</p>
                                <p class="text-[11px] text-[var(--morandi-green)] font-black">+$${Math.round(item.netProfit).toLocaleString()}</p>
                            </div>
                            <div class="del-btn text-[#E9E6DD] hover:text-[var(--morandi-red)] text-sm p-2">✕</div>
                        </div>
                    </div>
                    
                    <div class="detail-panel border-t border-[#F5F5F3] px-6">
                        <div class="flex gap-6 items-start">
                            <div class="flex flex-col items-center gap-3">
                                <div class="w-32 h-32 rounded-3xl overflow-hidden bg-white border border-dashed border-[#D5D1C5] flex items-center justify-center relative">
                                    ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : `<span class="text-[10px] text-[#B7B7A4] font-bold uppercase tracking-widest text-center">No Image</span>`}
                                </div>
                            </div>

                            <div class="flex-grow">
                                <div class="flex justify-between items-center mb-3">
                                    <span class="text-[10px] font-black text-[#B7B7A4] uppercase tracking-widest">Details</span>
                                    <span class="px-3 py-1 ${currentTierStyle} rounded-lg text-[9px] font-black uppercase tracking-wider">${item.weightLabel}</span>
                                </div>
                                
                                <div class="stat-box">
                                    <span class="text-[10px] font-black text-[var(--highlight-yellow)] uppercase italic">TWD</span>
                                    <span class="text-xs font-black text-[var(--highlight-yellow)]">$${item.rawTwdCost.toLocaleString()}</span>
                                </div>
                                
                                <div class="stat-box">
                                    <span class="text-[10px] font-black text-[var(--morandi-red)] uppercase italic">Fees</span>
                                    <span class="text-xs font-black text-[var(--morandi-red)]">-$${item.fee.toLocaleString()}</span>
                                </div>
                                
                                <div class="stat-box">
                                    <span class="text-[10px] font-black text-[var(--morandi-blue)] uppercase italic">Tax</span>
                                    <span class="text-xs font-black text-[var(--morandi-blue)]">+$${(item.refundTwd || 0).toLocaleString()}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                el.querySelector('.card-header').onclick = (e) => { 
                    if(!e.target.closest('.del-btn')) el.closest('.history-card').classList.toggle('expanded'); 
                };
                el.querySelector('.del-btn').onclick = (e) => { 
                    e.stopPropagation(); 
                    historyData = historyData.filter(h => h.id !== item.id);
                    saveToStorage();
                };
                list.appendChild(el);
            });
            document.getElementById('totalProfit').innerText = Math.round(totalProfitSum).toLocaleString();
        }

        const inputs = ['foreignPrice','profitPercent','manualCost','bankFeeInput','currency','itemName'];
        inputs.forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('input', calculate);
            el.addEventListener('change', calculate);
        });

        document.querySelectorAll('.weight-btn').forEach(btn => btn.onclick = () => {
            document.querySelectorAll('.weight-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); 
            currentWeightTier = btn.dataset.tier; 
            currentWeightLabel = btn.dataset.label;
            calculate();
        });

        document.getElementById('addToListBtn').onclick = () => {
            const item = calculate(); 
            if(!item || item.foreign <= 0) return;
            historyData.unshift(item);
            saveToStorage();
            document.getElementById('foreignPrice').value = '';
            document.getElementById('itemName').value = '';
            capturedImageData = null;
            document.getElementById('photoPreviewContainer').classList.add('hidden');
            calculate();
        };

        document.getElementById('cameraBtn').onclick = () => document.getElementById('hiddenCameraInput').click();
        document.getElementById('hiddenCameraInput').onchange = (e) => {
            const f = e.target.files[0];
            if(f) {
                const r = new FileReader();
                r.onload = (re) => { 
                    capturedImageData = re.target.result; 
                    document.getElementById('photoPreviewImg').src = capturedImageData; 
                    document.getElementById('photoPreviewContainer').classList.remove('hidden'); 
                    calculate(); 
                };
                r.readAsDataURL(f);
            }
        };
        document.getElementById('clearPhotoBtn').onclick = () => { 
            capturedImageData = null; 
            document.getElementById('photoPreviewContainer').classList.add('hidden'); 
            calculate(); 
        };

        document.getElementById('syncBtn').onclick = syncRates;
        document.getElementById('searchHistory').oninput = renderHistory;

        window.onload = () => { 
            syncRates(); 
            renderHistory();
            calculate(); 
        };
    </script>
</body>
</html>
