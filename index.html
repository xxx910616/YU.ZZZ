<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YU ZZZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .history-card.expanded .detail-panel { display: block; }
        .detail-panel { display: none; }
        #loadingOverlay {
            position: fixed; inset: 0; background: white;
            display: flex; justify-content: center; align-items: center;
            z-index: 999; transition: opacity 0.5s;
        }
        .stat-box { flex: 1; padding: 0.5rem; background: #fff; border: 1px solid #eee; border-radius: 1rem; text-align: center; }
    </style>
</head>
<body class="bg-[#F0F9FF]">

    <div id="loadingOverlay">
        <div class="flex flex-col items-center">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-amber-500 mb-4"></div>
            <p class="text-sm text-gray-400">系統連線中...</p>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-6">
        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm space-y-4">
            <input type="text" id="itemName" placeholder="產品名稱" class="w-full p-3 border rounded-xl outline-none focus:border-amber-400">
            <div class="flex gap-2">
                <input type="number" id="foreignPrice" placeholder="外幣金額" class="flex-grow p-3 border rounded-xl">
                <select id="currency" class="p-3 border rounded-xl bg-gray-50">
                    <option value="JPY">JPY</option>
                    <option value="KRW">KRW</option>
                    <option value="USD">USD</option>
                </select>
            </div>
            
            <button id="cameraBtn" class="w-full py-4 bg-amber-50 text-amber-600 rounded-2xl font-bold active:scale-95 transition-all">📸 拍攝或上傳照片</button>
            <input type="file" id="hiddenCameraInput" accept="image/*" capture="environment" class="hidden">
            
            <div id="photoPreviewContainer" class="hidden relative">
                <img id="photoPreviewImg" class="w-full rounded-2xl border-4 border-white shadow-md">
                <button id="clearPhotoBtn" class="absolute top-2 right-2 bg-black/50 text-white w-8 h-8 rounded-full">✕</button>
            </div>

            <button id="addToListBtn" class="w-full py-4 bg-black text-white rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">儲存至雲端歷史</button>
        </div>

        <div class="flex items-center justify-between px-2">
            <input type="text" id="searchHistory" placeholder="搜尋紀錄..." class="bg-white px-4 py-2 rounded-full border text-sm w-1/2">
            <div class="text-right">
                <p class="text-[10px] font-bold text-gray-400">TOTAL PROFIT</p>
                <p class="text-xl font-black text-green-600">$<span id="totalProfit">0</span></p>
            </div>
        </div>

        <div id="historyList" class="space-y-4 pb-10"></div>
    </div>

    <div id="imageModal" class="fixed inset-0 bg-black/90 hidden z-[1000] items-center justify-center p-4">
        <img id="fullImage" class="max-w-full max-h-full rounded-lg">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // === 1. 請在此填入你的 Firebase Config ===
        const firebaseConfig = {
            apiKey: "你的APIKEY",
            authDomain: "你的DOMAIN",
            projectId: "你的PROJECTID",
            storageBucket: "你的BUCKET",
            messagingSenderId: "你的SENDERID",
            appId: "你的APPID"
        };

        const fbApp = initializeApp(firebaseConfig);
        const db = getFirestore(fbApp);
        const auth = getAuth(fbApp);
        const appId = "yu-zzz-app"; 

        let user = null;
        let historyData = [];
        let capturedImageData = null;

        // === 強制關閉遮罩邏輯 (防死鎖) ===
        const hideOverlay = () => {
            const el = document.getElementById('loadingOverlay');
            if (el) { el.style.opacity = '0'; setTimeout(() => el.style.display = 'none', 500); }
        };
        setTimeout(hideOverlay, 4000); // 4秒後無論如何都關掉

        // === 2. 核心：身分與資料監聽 ===
        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                console.log("✅ 登入成功:", user.uid);
                hideOverlay(); // 登入成功立刻關閉

                // 注意：這裡不使用 orderBy 避免沒設 index 導致卡死
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'history');
                onSnapshot(colRef, (snapshot) => {
                    historyData = snapshot.docs.map(doc => doc.data());
                    // 在前端排順序
                    historyData.sort((a, b) => b.id - a.id);
                    renderHistory();
                }, (err) => {
                    console.error("❌ Firestore 讀取錯誤:", err);
                    alert("資料讀取失敗，請檢查 F12 Console 訊息");
                });
            } else {
                console.warn("⚠️ 未登入，請確認 Firebase Auth 設定");
                // 如果你沒有做登入頁面，這裡會一直顯示未登入
            }
        });

        // === 3. 圖片壓縮 (極致瘦身 400px) ===
        async function compressImage(base64) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxWidth = 400;
                    const scale = maxWidth / img.width;
                    canvas.width = maxWidth;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6)); // 60% 品質
                };
            });
        }

        // === 4. UI 渲染 ===
        function renderHistory() {
            const list = document.getElementById('historyList');
            const search = document.getElementById('searchHistory').value.toLowerCase();
            list.innerHTML = '';
            let profitSum = 0;

            historyData.filter(item => (item.name || '').toLowerCase().includes(search)).forEach(item => {
                profitSum += (item.netProfit || 0);
                const card = document.createElement('div');
                card.className = 'history-card bg-white rounded-[2rem] shadow-sm border border-amber-100 overflow-hidden';
                card.innerHTML = `
                    <div class="p-5 flex items-center justify-between cursor-pointer" onclick="this.parentElement.classList.toggle('expanded')">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-amber-50 flex items-center justify-center text-amber-500 font-bold text-xs">${item.currency.slice(0,1)}</div>
                            <div class="min-w-0">
                                <h3 class="font-bold text-gray-800 truncate text-sm">${item.name}</h3>
                                <p class="text-[9px] text-gray-400 font-mono">${item.date} ${item.time}</p>
                            </div>
                        </div>
                        <div class="text-right flex items-center gap-3">
                            <div class="leading-none">
                                <p class="font-black text-gray-900">$${(item.finalPrice || 0).toLocaleString()}</p>
                                <p class="text-[10px] text-green-500 font-bold">+$${Math.round(item.netProfit || 0)}</p>
                            </div>
                            <button onclick="event.stopPropagation(); window.deleteItem('${item.id}')" class="text-gray-200 hover:text-red-400">✕</button>
                        </div>
                    </div>
                    <div class="detail-panel p-5 bg-amber-50/30 border-t border-amber-50">
                        <div class="flex gap-4 mb-4">
                            ${item.image ? `<img src="${item.image}" onclick="window.showImg('${item.image}')" class="w-20 h-20 rounded-xl object-cover border-2 border-white shadow-sm">` : ''}
                            <div class="text-[11px] space-y-1 text-gray-500">
                                <p>匯率: ${item.bankRate}</p>
                                <p>重量: ${item.weightLabel}</p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <div class="stat-box"><p class="text-[8px] text-gray-400">成本</p><p class="text-[10px] font-bold">$${item.rawTwdCost}</p></div>
                            <div class="stat-box"><p class="text-[8px] text-red-300">手續費</p><p class="text-[10px] font-bold text-red-400">-$${item.extraFee}</p></div>
                            <div class="stat-box"><p class="text-[8px] text-green-400">利潤</p><p class="text-[10px] font-bold text-green-600">$${Math.round(item.netProfit)}</p></div>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
            document.getElementById('totalProfit').innerText = Math.round(profitSum).toLocaleString();
        }

        // === 5. 功能按鈕 ===
        document.getElementById('addToListBtn').onclick = async () => {
            if (!user) return alert("請確認 Firebase 登入狀態");
            const name = document.getElementById('itemName').value || "未命名產品";
            const foreign = parseFloat(document.getElementById('foreignPrice').value) || 0;
            
            if (foreign <= 0) return alert("請輸入正確金額");

            let finalImage = null;
            if (capturedImageData) {
                finalImage = await compressImage(capturedImageData);
            }

            const newItem = {
                id: Date.now(),
                name,
                foreign,
                currency: document.getElementById('currency').value,
                image: finalImage,
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString(),
                bankRate: 0.22, // 這裡請替換成你的計算邏輯
                rawTwdCost: Math.round(foreign * 0.22),
                extraFee: 0,
                netProfit: 100, // 這裡請替換成你的計算邏輯
                finalPrice: 500,
                weightLabel: '一般'
            };

            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'history', newItem.id.toString()), newItem);
            
            // 清除輸入
            document.getElementById('itemName').value = '';
            document.getElementById('foreignPrice').value = '';
            capturedImageData = null;
            document.getElementById('photoPreviewContainer').classList.add('hidden');
        };

        // 拍照
        document.getElementById('cameraBtn').onclick = () => document.getElementById('hiddenCameraInput').click();
        document.getElementById('hiddenCameraInput').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    capturedImageData = ev.target.result;
                    document.getElementById('photoPreviewImg').src = capturedImageData;
                    document.getElementById('photoPreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        // 燈箱與刪除
        window.showImg = (src) => {
            document.getElementById('fullImage').src = src;
            document.getElementById('imageModal').style.display = 'flex';
        };
        document.getElementById('imageModal').onclick = () => document.getElementById('imageModal').style.display = 'none';
        
        window.deleteItem = async (id) => {
            if (confirm("確定刪除？")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'history', id));
            }
        };

        document.getElementById('searchHistory').oninput = renderHistory;

    </script>
</body>
</html>
