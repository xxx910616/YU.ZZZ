<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YU.ZZZ OFFICIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-gray: #F8F9FA;
            --soft-blue: #F0F7FF;
            --deep-black: #1A1A1A;
            --pure-white: #FFFFFF;
            --highlight-yellow: #FACC15;
            --list-yellow: #FFFBEB; 
            --brand-blue-grey: #5b7189;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans TC", sans-serif; 
            background-color: var(--bg-gray); 
            color: var(--deep-black);
            overflow-x: hidden;
        }
        
        .color-brand-custom { color: var(--brand-blue-grey); }
        .bg-brand-custom { background-color: var(--brand-blue-grey); }
        .color-yellow-main { color: var(--highlight-yellow); }

        input::-webkit-outer-spin-button, 
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .detail-panel { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .history-card.expanded .detail-panel { max-height: 800px; }
        .history-card.expanded .chevron { transform: rotate(180deg); }
        
        .weight-btn.active {
            background-color: var(--brand-blue-grey) !important; 
            color: var(--pure-white) !important;
            border-color: var(--brand-blue-grey) !important;
        }
        
        .stat-box {
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            height: 64px; 
            background: white;
            border-radius: 14px;
            border: 1px solid #fef3c7;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .list-container {
            background-color: var(--list-yellow);
            border-top: 1px solid #FEF3C7;
            box-shadow: 0 -10px 25px -5px rgba(251, 191, 36, 0.1);
        }

        #imageModal { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 20px; }
        
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease-out;
        }
        
        .force-hide { opacity: 0 !important; pointer-events: none !important; }
    </style>
</head>
<body class="min-h-screen">
    <!-- 加載畫面 -->
    <div id="loadingOverlay">
        <h1 class="text-4xl font-black color-brand-custom italic tracking-tighter mb-4">YU.ZZZ</h1>
        <div class="w-8 h-8 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div class="max-w-md mx-auto min-h-screen flex flex-col relative">
        <!-- 頂部面板 -->
        <div class="p-6 pb-8 bg-white sticky top-0 z-20 shadow-sm border-b border-gray-100 rounded-b-[2.5rem]">
            <div class="flex justify-between items-start mb-6">
                <div class="flex flex-col">
                    <h1 class="text-5xl font-black color-brand-custom italic tracking-tighter leading-none">YU.ZZZ</h1>
                    <span class="text-[10px] font-black text-black tracking-[0.3em] mt-1 ml-1 uppercase">Official｜2 0 0 2</span>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-gray-400 font-black uppercase tracking-widest leading-none mb-1">Total Profit</p>
                    <p class="text-4xl font-black color-yellow-main italic leading-none tabular-nums">$<span id="totalProfit">0</span></p>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[var(--soft-blue)] p-3 rounded-2xl border border-blue-50">
                    <p class="text-[9px] text-blue-400 font-bold uppercase mb-1">匯率 (Exchange)</p>
                    <div class="flex items-center justify-between">
                        <div class="flex flex-col">
                            <p id="currentRateDisplay" class="text-lg font-mono font-bold text-blue-900 leading-none">0.0240</p>
                            <p id="updateTime" class="text-[8px] text-blue-300 font-mono mt-1">Ready</p>
                        </div>
                        <button id="syncBtn" class="p-2 bg-white text-blue-600 rounded-xl shadow-sm border border-blue-100 active:scale-90">
                            <svg id="syncIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="bg-[var(--soft-blue)] p-3 rounded-2xl border border-blue-50">
                    <p class="text-[9px] text-blue-400 font-bold mb-1 uppercase">刷卡手續費 %</p>
                    <div class="flex items-center gap-1">
                        <input type="number" id="bankFeeInput" value="1.5" step="0.1" class="w-full bg-transparent text-lg font-black text-blue-900 leading-none outline-none">
                        <span class="text-lg font-black text-blue-900">%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 輸入區域 -->
        <div class="px-6 py-5 space-y-5">
            <div class="grid grid-cols-3 gap-2.5">
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-gray-500 uppercase ml-1">幣別</label>
                    <select id="currency" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none shadow-sm">
                        <option value="KRW">KRW 🇰🇷</option>
                        <option value="JPY">JPY 🇯🇵</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-gray-500 uppercase ml-1">利潤 %</label>
                    <input type="number" id="profitPercent" value="10" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none shadow-sm">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-gray-500 uppercase ml-1">額外成本</label>
                    <input type="number" id="manualCost" value="0" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none shadow-sm">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[9px] font-black text-gray-400 uppercase ml-1 tracking-widest">重量級距 (Weight)</label>
                <div class="grid grid-cols-2 gap-2" id="weightBtnContainer">
                    <button data-tier="0" data-label="2kg 以下" class="weight-btn active border bg-white p-3 rounded-xl text-[10px] font-black shadow-sm">2kg 以下 (+0)</button>
                    <button data-tier="2-5" data-label="2-5kg" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black shadow-sm">2-5kg (+60)</button>
                    <button data-tier="5-10" data-label="5-10kg" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black shadow-sm">5-10kg (+100)</button>
                    <button data-tier="10+" data-label="10kg+" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black shadow-sm">10kg+ (+150)</button>
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[9px] font-black text-gray-400 uppercase ml-1 tracking-widest">產品資訊</label>
                <div class="flex gap-2.5">
                    <input type="text" id="itemName" placeholder="產品名稱..." class="w-full p-4 bg-white border border-gray-200 rounded-xl text-sm font-bold outline-none shadow-sm">
                    <button id="cameraBtn" class="px-5 bg-brand-custom text-white rounded-xl shadow-md flex items-center justify-center active:scale-90">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812-1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                    </button>
                    <input type="file" id="hiddenCameraInput" accept="image/*" capture="environment" class="hidden">
                </div>
                <div id="photoPreviewContainer" class="hidden flex justify-center pt-2">
                    <div class="relative">
                        <img id="photoPreviewImg" src="" class="w-24 h-24 object-cover rounded-2xl border-4 border-white shadow-xl">
                        <button id="clearPhotoBtn" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-lg">✕</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 計算顯示區 -->
        <div class="px-6 pb-8 space-y-5">
            <div class="space-y-1">
                <label class="text-[10px] uppercase font-black text-gray-400 italic block pl-2 tracking-tighter">當地原價</label>
                <div class="relative">
                    <input type="number" id="foreignPrice" placeholder="0" class="w-full p-6 pl-8 pr-24 text-5xl font-black rounded-[2rem] outline-none bg-white border border-gray-200 shadow-inner tabular-nums text-gray-500">
                    <span id="priceSuffix" class="absolute right-8 top-1/2 -translate-y-1/2 font-black text-gray-200 text-2xl italic uppercase pointer-events-none">KRW</span>
                </div>
            </div>

            <div id="quickResult" class="hidden">
                <div class="bg-[var(--deep-black)] rounded-[2.5rem] p-7 text-white shadow-2xl relative overflow-hidden">
                    <div class="flex justify-between items-center mb-5">
                        <div class="min-w-0 pr-3">
                            <p class="text-[9px] text-yellow-400 font-bold uppercase tracking-widest">建議售價 (TWD)</p>
                            <p id="finalPrice" class="text-5xl font-black mt-1 tabular-nums text-white">$ 0</p>
                        </div>
                        <div class="text-right shrink-0 space-y-1.5">
                            <p class="text-[10px] font-bold text-red-400 italic uppercase">Fee: <span id="resExtra">-$0</span></p>
                            <p class="text-[10px] font-bold text-green-400 italic uppercase">Profit: <span id="resProfit">+$0</span></p>
                            <p class="text-[10px] font-bold text-gray-400 italic uppercase">Cost: <span id="resOriginal">+$0</span></p>
                        </div>
                    </div>
                    <button id="addToListBtn" class="w-full py-4.5 bg-yellow-400 text-black font-black text-lg rounded-2xl transition-all active:scale-95 uppercase tracking-widest shadow-lg h-14">加入紀錄清單</button>
                </div>
            </div>
        </div>

        <!-- 歷史清單 -->
        <div class="list-container p-6 rounded-t-[3rem] flex-grow min-h-[400px]">
            <div class="flex items-center gap-3 mb-6">
                <h2 class="text-[10px] font-black text-amber-900/60 uppercase tracking-tighter italic">LIST</h2>
                <div class="relative flex-grow">
                    <input type="text" id="searchHistory" placeholder="搜尋紀錄..." class="w-full py-2 px-4 bg-white border border-amber-100 rounded-xl text-[10px] font-bold outline-none shadow-sm">
                </div>
                <button id="exportCsvBtn" class="px-4 py-2 bg-white text-green-700 text-[10px] font-black rounded-xl border border-green-100 shadow-sm uppercase">CSV</button>
            </div>
            <div id="historyList" class="space-y-4"></div>
        </div>
    </div>

    <!-- 圖片彈窗 -->
    <div id="imageModal" onclick="this.style.display='none'">
        <img id="fullImage" src="" class="max-w-full max-h-[85vh] rounded-[2rem] shadow-2xl">
    </div>

    <!-- 核心腳本 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 1. 初始化頁面顯示 (不等待 Firebase)
        const loading = document.getElementById('loadingOverlay');
        setTimeout(() => {
            loading.classList.add('force-hide');
            setTimeout(() => loading.style.display = 'none', 500);
        }, 1000); // 1秒強制解鎖畫面

        // 2. Firebase 配置
        let db, auth, user = null;
        let history = [];
        let exchangeRates = { KRW: 0.0240, JPY: 0.210 };
        let currentWeightTier = "0";
        let capturedImageData = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'yu-zzz-official';

        // 3. 嘗試背景連接 Firebase
        try {
            const config = JSON.parse(__firebase_config);
            const app = initializeApp(config);
            auth = getAuth(app);
            db = getFirestore(app);

            const startAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            };
            startAuth().catch(e => console.warn("Auth failed, using offline mode"));

            onAuthStateChanged(auth, (u) => {
                user = u;
                if (user) {
                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'history'), (snap) => {
                        history = snap.docs.map(d => d.data()).sort((a,b) => b.id - a.id);
                        renderHistory();
                    }, (err) => console.warn("Firestore error", err));
                }
            });
        } catch(e) { console.error("Firebase init fail", e); }

        // 4. 計算邏輯
        const updateCalc = () => {
            const currency = document.getElementById('currency').value;
            const rate = exchangeRates[currency];
            const foreign = parseFloat(document.getElementById('foreignPrice').value) || 0;
            const bankFee = (parseFloat(document.getElementById('bankFeeInput').value) || 1.5) / 100;
            const profitP = (parseFloat(document.getElementById('profitPercent').value) || 10) / 100;
            const manualC = parseFloat(document.getElementById('manualCost').value) || 0;
            
            document.getElementById('priceSuffix').innerText = currency;
            document.getElementById('currentRateDisplay').innerText = rate.toFixed(4);

            if (foreign <= 0) {
                document.getElementById('quickResult').classList.add('hidden');
                return null;
            }

            document.getElementById('quickResult').classList.remove('hidden');
            let weightExtra = { "0": 0, "2-5": 60, "5-10": 100, "10+": 150 }[currentWeightTier];
            
            const rawCost = foreign * rate;
            const finalPrice = Math.round((rawCost / (1 - bankFee - profitP)) + weightExtra);
            const extraFee = Math.round(finalPrice * bankFee);
            const netProfit = finalPrice - rawCost - extraFee - manualC;

            document.getElementById('resOriginal').innerText = `+$${Math.round(rawCost)}`;
            document.getElementById('resExtra').innerText = `-$${extraFee}`;
            document.getElementById('resProfit').innerText = `+$${Math.round(netProfit)}`;
            document.getElementById('finalPrice').innerText = `$ ${finalPrice.toLocaleString()}`;

            return {
                id: Date.now().toString(),
                name: document.getElementById('itemName').value || '未命名產品',
                foreign, currency, bankRate: rate, finalPrice, netProfit, image: capturedImageData,
                date: new Date().toLocaleDateString(), time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
            };
        };

        // 5. 事件綁定
        document.querySelectorAll('input, select').forEach(el => el.oninput = updateCalc);
        document.querySelectorAll('.weight-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.weight-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentWeightTier = btn.dataset.tier;
                updateCalc();
            };
        });

        document.getElementById('addToListBtn').onclick = async () => {
            const data = updateCalc();
            if (data && user) {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'history', data.id), data);
                document.getElementById('foreignPrice').value = '';
                document.getElementById('itemName').value = '';
                capturedImageData = null;
                document.getElementById('photoPreviewContainer').classList.add('hidden');
            }
        };

        const renderHistory = () => {
            const list = document.getElementById('historyList');
            const search = document.getElementById('searchHistory').value.toLowerCase();
            list.innerHTML = '';
            let total = 0;
            history.filter(i => i.name.toLowerCase().includes(search)).forEach(i => {
                total += i.netProfit;
                const el = document.createElement('div');
                el.className = 'history-card bg-white p-5 rounded-[2rem] border border-amber-100 shadow-sm';
                el.innerHTML = `
                    <div class="flex justify-between items-center cursor-pointer">
                        <div class="flex items-center gap-3">
                            ${i.image ? `<img src="${i.image}" class="w-10 h-10 rounded-lg object-cover">` : '<div class="w-10 h-10 bg-gray-50 rounded-lg"></div>'}
                            <div>
                                <h3 class="font-black text-sm">${i.name}</h3>
                                <p class="text-[9px] text-blue-500 font-bold">${i.foreign} ${i.currency}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-black text-lg">$${i.finalPrice}</p>
                            <p class="text-[10px] text-green-600 font-bold">+$${Math.round(i.netProfit)}</p>
                        </div>
                    </div>
                `;
                list.appendChild(el);
            });
            document.getElementById('totalProfit').innerText = Math.round(total).toLocaleString();
        };

        // 相機功能
        const camInput = document.getElementById('hiddenCameraInput');
        document.getElementById('cameraBtn').onclick = () => camInput.click();
        camInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (re) => {
                    capturedImageData = re.target.result;
                    document.getElementById('photoPreviewImg').src = capturedImageData;
                    document.getElementById('photoPreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };
        document.getElementById('clearPhotoBtn').onclick = () => {
            capturedImageData = null;
            document.getElementById('photoPreviewContainer').classList.add('hidden');
        };

        // 匯率更新
        document.getElementById('syncBtn').onclick = async () => {
            const icon = document.getElementById('syncIcon');
            icon.classList.add('animate-spin');
            try {
                const r = await fetch('https://open.er-api.com/v6/latest/TWD');
                const d = await r.json();
                if (d.result === 'success') {
                    exchangeRates.KRW = 1 / d.rates.KRW;
                    exchangeRates.JPY = 1 / d.rates.JPY;
                    document.getElementById('updateTime').innerText = 'Updated';
                    updateCalc();
                }
            } catch(e) {}
            setTimeout(() => icon.classList.remove('animate-spin'), 1000);
        };
    </script>
</body>
</html>
