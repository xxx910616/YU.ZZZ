<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YU ZZZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .history-card.expanded .detail-panel { display: block; }
        .detail-panel { display: none; }
        .chevron { transition: transform 0.3s; }
        .history-card.expanded .chevron { transform: rotate(180deg); }
        .stat-box {
            flex: 1;
            padding: 0.75rem;
            background: white;
            border: 1px solid #fee2e2;
            border-radius: 1rem;
            text-align: center;
        }
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body class="bg-[#F0F9FF]">

    <div id="loadingOverlay">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-amber-500"></div>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-6">
        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm space-y-4">
            <input type="text" id="itemName" placeholder="產品名稱" class="w-full p-3 border rounded-xl">
            <input type="number" id="foreignPrice" placeholder="外幣價格" class="w-full p-3 border rounded-xl">
            <select id="currency" class="w-full p-3 border rounded-xl">
                <option value="JPY">JPY</option>
                <option value="KRW">KRW</option>
            </select>
            <div id="photoPreviewContainer" class="hidden relative">
                <img id="photoPreviewImg" class="w-full rounded-2xl border-4 border-white shadow-lg">
                <button id="clearPhotoBtn" class="absolute top-2 right-2 bg-black/50 text-white p-2 rounded-full">✕</button>
            </div>

            <button id="cameraBtn" class="w-full py-4 bg-amber-100 text-amber-600 rounded-2xl font-bold">開啟相機</button>
            <input type="file" id="hiddenCameraInput" accept="image/*" capture="environment" class="hidden">
            <button id="addToListBtn" class="w-full py-4 bg-black text-white rounded-2xl font-bold">加入清單</button>
        </div>

        <div class="flex items-center justify-between px-2">
            <input type="text" id="searchHistory" placeholder="搜尋紀錄..." class="bg-white px-4 py-2 rounded-full border text-sm">
            <div class="text-right">
                <p class="text-[10px] font-bold text-gray-400 uppercase">Total Profit</p>
                <p class="text-xl font-black text-green-600">$<span id="totalProfit">0</span></p>
            </div>
        </div>

        <div id="historyList" class="space-y-4 pb-20"></div>
    </div>

    <div id="imageModal" class="fixed inset-0 bg-black/90 hidden z-[200] items-center justify-center p-4">
        <img id="fullImage" class="max-w-full max-h-full rounded-lg shadow-2xl">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, updateDoc, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- Firebase 設定 (請替換成你的設定) ---
        const firebaseConfig = { /* 你的 Config */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = "yu-zzz-app"; // 你的 Artifact ID

        let user = null;
        let history = [];
        let capturedImageData = null;

        // --- 核心效能優化：圖片壓縮 ---
        function compressImage(base64Str, maxWidth = 800) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const scale = maxWidth / img.width;
                    if (scale < 1) {
                        canvas.width = maxWidth;
                        canvas.height = img.height * scale;
                    } else {
                        canvas.width = img.width;
                        canvas.height = img.height;
                    }
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7)); // 壓縮品質 0.7
                };
            });
        }

        // --- Firebase 資料操作 ---
        async function saveToFirestore(itemData) {
            if (!user) return;
            try {
                // 如果有圖片，先壓縮再上傳
                if (itemData.image) {
                    itemData.image = await compressImage(itemData.image);
                }
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'history', itemData.id.toString());
                await setDoc(docRef, itemData);
            } catch (err) {
                console.error("儲存失敗:", err);
                alert("儲存失敗，請檢查網路或圖片大小");
            }
        }

        async function deleteFromFirestore(id) {
            if (!user || !confirm("確定要刪除嗎？")) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'history', id.toString());
            await deleteDoc(docRef);
        }

        async function updateNameInFirestore(id, newName) {
            if (!user) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'history', id.toString());
            await updateDoc(docRef, { name: newName });
        }

        // --- UI 渲染邏輯 ---
        function renderHistory() {
            const list = document.getElementById('historyList');
            const searchQuery = document.getElementById('searchHistory').value.toLowerCase();
            list.innerHTML = '';
            let totalProfit = 0;

            const filteredHistory = history.filter(item => (item.name || '').toLowerCase().includes(searchQuery));

            filteredHistory.forEach((item) => {
                totalProfit += (item.netProfit || 0);
                const el = document.createElement('div');
                el.className = 'history-card bg-white rounded-[2rem] shadow-sm border border-amber-100 overflow-hidden transition-all';
                el.innerHTML = `
                    <div class="p-5 flex items-center justify-between cursor-pointer card-header">
                        <div class="flex items-center gap-4 min-w-0">
                            <div class="chevron transition-transform text-amber-200">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                            </div>
                            <div class="min-w-0">
                                <h3 class="font-black text-black truncate text-[15px] tracking-tight mb-0.5">${item.name || '未命名'}</h3>
                                <p class="text-[10px] font-mono font-bold text-blue-500 leading-tight">
                                    ${(item.foreign || 0).toLocaleString()} ${item.currency} · RATE ${(item.bankRate || 0).toFixed(4)}
                                </p>
                                <p class="text-[9px] font-mono font-bold text-gray-300 mt-1 tracking-tight">${item.date} ${item.time}</p>
                            </div>
                        </div>
                        <div class="text-right flex items-center gap-4">
                            <div>
                                <p class="text-[18px] font-black text-gray-900 leading-none tabular-nums">$${(item.finalPrice || 0).toLocaleString()}</p>
                                <p class="text-[11px] text-green-600 font-black mt-1">+$${Math.round(item.netProfit || 0).toLocaleString()}</p>
                            </div>
                            <button class="delete-btn p-2 text-gray-200 hover:text-red-400 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="3"></path></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="detail-panel bg-amber-50/50 border-t border-amber-100/50">
                        <div class="p-5 space-y-6">
                            <div class="flex flex-col gap-3">
                                <label class="text-[9px] font-black text-amber-400 uppercase italic tracking-widest pl-1">Product Details</label>
                                <div class="flex gap-4 items-center">
                                    ${item.image ? `<img src="${item.image}" class="detail-img w-24 h-24 rounded-2xl object-cover border-4 border-white shadow-md shrink-0 cursor-pointer">` : `<div class="w-24 h-24 bg-white rounded-2xl border border-amber-100 flex items-center justify-center text-amber-200 shrink-0 text-[10px] font-bold">NO IMAGE</div>`}
                                    <div class="flex-grow min-w-0">
                                        <label class="text-[8px] font-black text-blue-400 uppercase italic mb-1 block">Product Name</label>
                                        <div class="name-display-area flex items-center gap-2 mb-2">
                                            <span class="text-sm font-black text-gray-700 truncate">${item.name}</span>
                                            <button class="edit-name-btn p-1.5 bg-white rounded-lg shadow-sm text-amber-400 hover:text-amber-500 active:scale-90 transition-all">
                                                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"></path></svg>
                                            </button>
                                        </div>
                                        <div class="name-edit-area hidden flex items-center gap-2 mb-2">
                                            <input type="text" value="${item.name}" class="edit-input-field flex-grow p-2.5 bg-white border border-amber-200 rounded-xl text-xs font-bold outline-none shadow-sm text-gray-700">
                                            <button class="save-name-btn w-9 h-9 bg-green-500 text-white rounded-xl shadow-md active:scale-90 flex items-center justify-center shrink-0">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                                            </button>
                                        </div>
                                        <span class="text-[10px] font-black text-amber-600 bg-amber-100 px-2 py-0.5 rounded-full uppercase italic">${item.weightLabel || 'N/A'}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <div class="stat-box"><p class="text-[8px] text-gray-400 font-bold mb-1">Cost</p><p class="text-[11px] font-black text-gray-700">$${(item.rawTwdCost || 0).toLocaleString()}</p></div>
                                <div class="stat-box"><p class="text-[8px] text-red-300 font-bold mb-1">Fees</p><p class="text-[11px] font-black text-red-400">-$${(item.extraFee || 0).toLocaleString()}</p></div>
                                <div class="stat-box"><p class="text-[8px] text-blue-300 font-bold mb-1">Refund</p><p class="text-[11px] font-black text-blue-400">+$${(item.refundTwd || 0).toLocaleString()}</p></div>
                                <div class="stat-box !border-green-100 !bg-green-50/20"><p class="text-[8px] text-green-400 font-black mb-1">Profit</p><p class="text-[11px] font-black text-green-600">+$${Math.round(item.netProfit || 0).toLocaleString()}</p></div>
                            </div>
                        </div>
                    </div>
                `;

                // 事件綁定
                el.querySelector('.card-header').onclick = (e) => {
                    if (!e.target.closest('button')) el.classList.toggle('expanded');
                };
                el.querySelector('.delete-btn').onclick = () => deleteFromFirestore(item.id);
                el.querySelector('.edit-name-btn').onclick = () => {
                    el.querySelector('.name-display-area').classList.add('hidden');
                    el.querySelector('.name-edit-area').classList.remove('hidden');
                    el.querySelector('.edit-input-field').focus();
                };
                el.querySelector('.save-name-btn').onclick = () => {
                    updateNameInFirestore(item.id, el.querySelector('.edit-input-field').value);
                };
                if (item.image) {
                    el.querySelector('.detail-img').onclick = () => {
                        document.getElementById('fullImage').src = item.image;
                        document.getElementById('imageModal').classList.remove('hidden');
                        document.getElementById('imageModal').classList.add('flex');
                    };
                }

                list.appendChild(el);
            });
            document.getElementById('totalProfit').innerText = Math.round(totalProfit).toLocaleString();
        }

        // --- 初始化與狀態監聽 ---
        onAuthStateChanged(auth, (u) => {
            user = u;
            // 優化 1: 只要確認登入狀態，立刻隱藏 Loading，不等待資料
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);

            if (user) {
                // 優化 2: 使用排序後的 Query，減輕前端運算
                const historyRef = collection(db, 'artifacts', appId, 'public', 'data', 'history');
                const q = query(historyRef, orderBy("id", "desc")); 

                onSnapshot(q, (snapshot) => {
                    history = snapshot.docs.map(doc => doc.data());
                    renderHistory();
                }, (err) => console.error("Firestore Error:", err));
            }
        });

        // --- 相機與圖片處理 ---
        document.getElementById('cameraBtn').onclick = () => document.getElementById('hiddenCameraInput').click();
        document.getElementById('hiddenCameraInput').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    capturedImageData = event.target.result;
                    document.getElementById('photoPreviewImg').src = capturedImageData;
                    document.getElementById('photoPreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };
        document.getElementById('clearPhotoBtn').onclick = () => {
            capturedImageData = null;
            document.getElementById('photoPreviewContainer').classList.add('hidden');
        };
        document.getElementById('imageModal').onclick = function() { 
            this.classList.add('hidden'); 
            this.classList.remove('flex');
        };

        // --- 搜尋功能 ---
        document.getElementById('searchHistory').oninput = renderHistory;

        // --- 暫存資料邏輯 (對應你的 updatePricePreview) ---
        function getNewItemData() {
            const now = new Date();
            const id = Date.now();
            // 這邊請補齊你原本 updatePricePreview 內所有的計算邏輯
            return {
                id: id,
                timestamp: now.toLocaleString(),
                date: now.toLocaleDateString(),
                time: now.toLocaleTimeString(),
                name: document.getElementById('itemName').value || '未命名產品',
                image: capturedImageData,
                currency: document.getElementById('currency').value,
                foreign: parseFloat(document.getElementById('foreignPrice').value) || 0,
                bankRate: 0.22, // 範例匯率
                rawTwdCost: 1000, // 範例
                extraFee: 50,
                refundTwd: 10,
                finalPrice: 1200,
                netProfit: 140,
                weightLabel: '輕型',
            };
        }

        document.getElementById('addToListBtn').onclick = async () => {
            const data = getNewItemData();
            if (data.foreign > 0) {
                await saveToFirestore(data);
                // 清空欄位
                document.getElementById('foreignPrice').value = '';
                document.getElementById('itemName').value = '';
                capturedImageData = null;
                document.getElementById('photoPreviewContainer').classList.add('hidden');
            }
        };

    </script>
</body>
</html>
