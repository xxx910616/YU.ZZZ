<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YU.ZZZ OFFICIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-gray: #F8F9FA;
            --soft-blue: #F0F7FF;
            --deep-black: #1A1A1A;
            --pure-white: #FFFFFF;
            --highlight-yellow: #FACC15;
            --list-yellow: #FFFBEB; 
            --brand-blue-grey: #5b7189;
            --item-border-yellow: #FEF3C7;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-gray); 
            color: var(--deep-black);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .color-brand-custom { color: var(--brand-blue-grey); }
        .bg-brand-custom { background-color: var(--brand-blue-grey); }
        .color-yellow-main { color: var(--highlight-yellow); }

        input::-webkit-outer-spin-button, 
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .detail-panel { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .history-card.expanded .detail-panel { max-height: 1000px; }
        .history-card.expanded .chevron { transform: rotate(180deg); }
        
        .weight-btn.active {
            background-color: var(--brand-blue-grey) !important; 
            color: var(--pure-white) !important;
            border-color: var(--brand-blue-grey) !important;
        }
        
        .stat-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: white;
            border-radius: 12px;
            border: 1px solid var(--item-border-yellow);
            margin-bottom: 8px;
        }

        .list-container {
            background-color: var(--list-yellow);
            border-top: 1px solid #FEF3C7;
        }

        #imageModal { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
        
        /* 強制按鈕在最上層 */
        .z-top-force { z-index: 99 !important; }
        .active-scale:active { transform: scale(0.96); opacity: 0.8; }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-md mx-auto min-h-screen flex flex-col relative">
        <!-- Header -->
        <div class="p-6 pb-8 bg-white sticky top-0 z-40 shadow-sm border-b border-gray-100 rounded-b-[2.5rem]">
            <div class="flex justify-between items-start mb-6">
                <div class="flex flex-col">
                    <h1 class="text-5xl font-black color-brand-custom italic tracking-tighter leading-none">YU.ZZZ</h1>
                    <span class="text-[10px] font-black text-black tracking-[0.3em] mt-1 ml-1 uppercase">Official｜2 0 0 2</span>
                </div>
                <div class="text-right flex flex-col justify-center">
                    <p class="text-[10px] text-gray-400 font-black uppercase tracking-widest mb-1">Total Profit</p>
                    <p class="text-4xl font-black color-yellow-main italic leading-none">$<span id="totalProfit">0</span></p>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[var(--soft-blue)] p-3 rounded-2xl border border-blue-50">
                    <p class="text-[9px] text-blue-400 font-bold uppercase mb-1">Exchange Rate</p>
                    <div class="flex items-center justify-between">
                        <p id="currentRateDisplay" class="text-lg font-mono font-bold text-blue-900">0.0240</p>
                        <button id="syncBtn" class="p-2 bg-white text-blue-600 rounded-xl active-scale shadow-sm">
                            <svg id="syncIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="bg-[var(--soft-blue)] p-3 rounded-2xl border border-blue-50">
                    <p class="text-[9px] text-blue-400 font-bold mb-1 uppercase">Bank Fee %</p>
                    <div class="flex items-center gap-1">
                        <input type="number" id="bankFeeInput" value="1.5" class="w-full bg-transparent text-lg font-black text-blue-900 outline-none">
                        <span class="text-lg font-black text-blue-900">%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Fields -->
        <div class="px-6 py-5 space-y-5">
            <div class="grid grid-cols-3 gap-2.5">
                <div>
                    <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Currency</label>
                    <select id="currency" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none shadow-sm">
                        <option value="KRW">KRW 🇰🇷</option>
                        <option value="JPY">JPY 🇯🇵</option>
                    </select>
                </div>
                <div>
                    <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Profit %</label>
                    <input type="number" id="profitPercent" value="10" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none">
                </div>
                <div>
                    <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Extra cost</label>
                    <input type="number" id="manualCost" value="0" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Weight Range</label>
                <div class="grid grid-cols-2 gap-2" id="weightBtnContainer">
                    <button data-tier="0" data-label="2kg 以下" class="weight-btn active border bg-white p-3 rounded-xl text-[10px] font-black">2kg 以下 (+0)</button>
                    <button data-tier="2-5" data-label="2-5kg" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black">2-5kg (+60)</button>
                    <button data-tier="5-10" data-label="5-10kg" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black">5-10kg (+100)</button>
                    <button data-tier="10+" data-label="10kg+" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black">10kg+ (+150)</button>
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Product Name</label>
                <div class="flex gap-2">
                    <input type="text" id="itemName" placeholder="輸入產品名稱..." class="w-full p-4 bg-white border border-gray-200 rounded-xl text-sm font-bold outline-none shadow-sm">
                    <button id="cameraBtn" class="px-5 bg-brand-custom text-white rounded-xl active-scale flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812-1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                    </button>
                    <input type="file" id="hiddenCameraInput" accept="image/*" capture="environment" class="hidden">
                </div>
                <div id="photoPreviewContainer" class="hidden flex justify-center pt-2">
                    <div class="relative">
                        <img id="photoPreviewImg" src="" class="w-20 h-20 object-cover rounded-xl border-2 border-white shadow-lg">
                        <button id="clearPhotoBtn" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-md">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Calculator Result (BLACK BOX) -->
        <div class="px-6 pb-8 space-y-4">
            <div class="space-y-1">
                <label class="text-[10px] uppercase font-black text-gray-400 italic block pl-2">Local Original Price</label>
                <div class="relative">
                    <input type="number" inputmode="decimal" id="foreignPrice" placeholder="0" class="w-full p-6 pr-24 text-5xl font-black rounded-[2rem] outline-none bg-white border-2 border-gray-100 shadow-inner text-gray-600">
                    <span id="priceSuffix" class="absolute right-8 top-1/2 -translate-y-1/2 font-black text-gray-300 text-2xl italic pointer-events-none uppercase">KRW</span>
                </div>
            </div>

            <div class="bg-[var(--deep-black)] rounded-[2.5rem] p-7 text-white shadow-2xl relative z-10">
                <div class="flex justify-between items-center mb-5">
                    <div>
                        <p class="text-[9px] text-yellow-400 font-bold uppercase tracking-widest">Suggested Price</p>
                        <p id="finalPrice" class="text-5xl font-black mt-1">$ 0</p>
                    </div>
                    <div class="text-right space-y-1">
                        <p class="text-[10px] font-bold text-red-400 italic">Fee: <span id="resExtra">-$0</span></p>
                        <p class="text-[10px] font-bold text-green-400 italic">Profit: <span id="resProfit">+$0</span></p>
                        <p class="text-[10px] font-bold text-gray-400 italic">Cost: <span id="resOriginal">+$0</span></p>
                    </div>
                </div>
                <button id="addToListBtn" class="w-full py-4 bg-yellow-400 text-black font-black text-lg rounded-2xl active-scale uppercase tracking-widest shadow-lg z-top-force">ADD TO LIST</button>
            </div>
        </div>

        <!-- List -->
        <div class="list-container p-6 rounded-t-[3rem] flex-grow min-h-[500px]">
            <div class="flex items-center gap-3 mb-6">
                <h2 class="text-[10px] font-black text-amber-900/60 uppercase italic whitespace-nowrap">LIST</h2>
                <input type="text" id="searchHistory" placeholder="Search..." class="w-full py-2 px-4 bg-white border border-amber-100 rounded-xl text-[10px] font-bold outline-none">
                <button id="exportCsvBtn" class="px-4 py-2 bg-white text-green-700 text-[10px] font-black rounded-xl border border-green-100 shadow-sm uppercase">CSV</button>
            </div>
            <div id="historyList" class="space-y-4"></div>
        </div>
    </div>

    <div id="imageModal" onclick="this.style.display='none'">
        <img id="fullImage" src="" class="max-w-[90%] max-h-[80vh] rounded-2xl">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'yu-zzz-official';

        let user = null;
        let historyData = [];
        let exchangeRates = { KRW: 0.0240, JPY: 0.210 };
        let currentWeightTier = "0";
        let currentWeightLabel = "2kg 以下";
        let capturedImageData = null;

        const taxRefundTable = [
            { min: 30000, max: 49999, refund: 1500 }, { min: 50000, max: 74999, refund: 3000 },
            { min: 75000, max: 99999, refund: 5000 }, { min: 100000, max: 124999, refund: 6000 },
            { min: 125000, max: 149999, refund: 8000 }, { min: 150000, max: 174999, refund: 9000 },
            { min: 175000, max: 199999, refund: 10000 }, { min: 200000, max: 224999, refund: 12000 },
            { min: 225000, max: 249999, refund: 13000 }, { min: 250000, max: 274999, refund: 15000 },
            { min: 275000, max: 299999, refund: 17000 }, { min: 300000, max: 499999, refund: 20000 },
            { min: 500000, max: 999999, refund: 35000 }
        ];

        // 核心計算邏輯
        function calculate() {
            const currency = document.getElementById('currency').value;
            const rate = exchangeRates[currency] || 0.024;
            const bankFee = (parseFloat(document.getElementById('bankFeeInput').value) || 1.5) / 100;
            const profitP = (parseFloat(document.getElementById('profitPercent').value) || 10) / 100;
            const foreign = parseFloat(document.getElementById('foreignPrice').value) || 0;
            const manual = parseFloat(document.getElementById('manualCost').value) || 0;

            document.getElementById('priceSuffix').innerText = currency;

            if (foreign <= 0) {
                document.getElementById('finalPrice').innerText = "$ 0";
                return null;
            }

            let weightExtra = 0;
            if (currentWeightTier === "2-5") weightExtra = 60;
            else if (currentWeightTier === "5-10") weightExtra = 100;
            else if (currentWeightTier === "10+") weightExtra = 150;

            const costTwd = foreign * rate;
            const target = (costTwd / (1 - bankFee - profitP)) + weightExtra;
            const final = Math.round(target);
            const fee = Math.round(final * bankFee);
            
            let refundTwd = 0;
            if (currency === 'KRW') {
                const tr = taxRefundTable.find(t => foreign >= t.min && foreign <= t.max);
                const refundKrw = tr ? tr.refund : (foreign >= 1000000 ? foreign * 0.06 : 0);
                refundTwd = Math.round(refundKrw * rate);
            }

            const profit = final - costTwd - fee - manual + refundTwd;

            document.getElementById('finalPrice').innerText = `$ ${final.toLocaleString()}`;
            document.getElementById('resOriginal').innerText = `+$${Math.round(costTwd).toLocaleString()}`;
            document.getElementById('resExtra').innerText = `-$${fee.toLocaleString()}`;
            document.getElementById('resProfit').innerText = `+$${Math.round(profit).toLocaleString()}`;

            const now = new Date();
            return {
                id: Date.now().toString(),
                date: `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`,
                time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
                name: document.getElementById('itemName').value || '未命名商品',
                image: capturedImageData,
                currency, foreign, bankRate: rate,
                rawTwdCost: Math.round(costTwd), weightLabel: currentWeightLabel,
                weightTier: currentWeightTier, refundTwd, finalPrice: final, netProfit: profit, manualCost: manual
            };
        }

        // 初始化 Auth
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };
        initAuth();

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (u) {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'history'), (snap) => {
                    historyData = snap.docs.map(d => d.data()).sort((a,b) => b.id - a.id);
                    renderHistory();
                }, (err) => console.error("Firestore Error:", err));
            }
        });

        async function syncRates() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/TWD');
                const data = await res.json();
                if (data.result === 'success') {
                    exchangeRates.KRW = 1 / data.rates.KRW;
                    exchangeRates.JPY = 1 / data.rates.JPY;
                    document.getElementById('currentRateDisplay').innerText = (exchangeRates[document.getElementById('currency').value]).toFixed(4);
                    calculate();
                }
            } catch (e) {}
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const search = (document.getElementById('searchHistory').value || '').toLowerCase();
            list.innerHTML = '';
            let total = 0;

            historyData.filter(i => (i.name||'').toLowerCase().includes(search)).forEach(item => {
                total += (item.netProfit || 0);
                const el = document.createElement('div');
                el.className = 'history-card bg-white rounded-3xl shadow-sm border border-amber-50 overflow-hidden active-scale mb-3';
                el.innerHTML = `
                    <div class="p-5 flex items-center justify-between card-header cursor-pointer">
                        <div class="flex items-center gap-3">
                            <div class="chevron transition-transform text-amber-200">▼</div>
                            <div>
                                <h3 class="font-black text-sm">${item.name}</h3>
                                <p class="text-[9px] text-gray-400 font-bold">${item.date} ${item.time}</p>
                            </div>
                        </div>
                        <div class="text-right flex items-center gap-4">
                            <div>
                                <p class="text-lg font-black">$${item.finalPrice.toLocaleString()}</p>
                                <p class="text-[10px] text-green-500 font-bold">+$${Math.round(item.netProfit).toLocaleString()}</p>
                            </div>
                            <button class="del-btn p-2 text-gray-200 hover:text-red-400">✕</button>
                        </div>
                    </div>
                    <div class="detail-panel bg-gray-50 p-5 flex gap-4">
                         ${item.image ? `<img src="${item.image}" class="w-20 h-20 rounded-xl object-cover border-2 border-white shadow">` : `<div class="w-20 h-20 bg-white rounded-xl border border-dashed flex items-center justify-center text-[8px] text-gray-300 font-bold">NO IMG</div>`}
                         <div class="flex-grow space-y-2">
                             <div class="stat-bar bg-white">
                                <span class="text-[9px] font-black text-gray-400">COST</span>
                                <span class="text-[10px] font-black text-gray-600">$${item.rawTwdCost.toLocaleString()}</span>
                             </div>
                             <div class="stat-bar bg-white">
                                <span class="text-[9px] font-black text-gray-400">WEIGHT</span>
                                <span class="text-[10px] font-black text-gray-600">${item.weightLabel}</span>
                             </div>
                         </div>
                    </div>
                `;
                el.querySelector('.card-header').onclick = (e) => { if(!e.target.closest('button')) el.classList.toggle('expanded'); };
                el.querySelector('.del-btn').onclick = (e) => { e.stopPropagation(); if(user) deleteDoc(doc(db,'artifacts',appId,'public','data','history',item.id)); };
                list.appendChild(el);
            });
            document.getElementById('totalProfit').innerText = Math.round(total).toLocaleString();
        }

        // 事件監聽修復
        const inputIds = ['foreignPrice','profitPercent','manualCost','bankFeeInput','currency','itemName'];
        inputIds.forEach(id => {
            const el = document.getElementById(id);
            ['input', 'change', 'keyup', 'blur'].forEach(evt => {
                el.addEventListener(evt, calculate);
            });
        });

        document.querySelectorAll('.weight-btn').forEach(btn => btn.onclick = () => {
            document.querySelectorAll('.weight-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); currentWeightTier = btn.dataset.tier; currentWeightLabel = btn.dataset.label;
            calculate();
        });

        // 核心：點擊 ADD TO LIST
        document.getElementById('addToListBtn').onclick = async (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            // 點擊時再次強制計算一次，確保抓到最新值
            const item = calculate(); 
            
            if(!item || item.foreign <= 0) {
                alert("請先輸入金額！");
                return;
            }

            if (!user) {
                alert("正在連接資料庫，請稍候...");
                return;
            }

            try {
                await setDoc(doc(db,'artifacts',appId,'public','data','history',item.id), item);
                // 成功後重置
                document.getElementById('foreignPrice').value = '';
                document.getElementById('itemName').value = '';
                capturedImageData = null;
                document.getElementById('photoPreviewContainer').classList.add('hidden');
                calculate();
            } catch (err) {
                console.error("Save Error:", err);
            }
        };

        // 相機功能
        document.getElementById('cameraBtn').onclick = () => document.getElementById('hiddenCameraInput').click();
        document.getElementById('hiddenCameraInput').onchange = (e) => {
            const f = e.target.files[0];
            if(f) {
                const r = new FileReader();
                r.onload = (re) => { capturedImageData = re.target.result; document.getElementById('photoPreviewImg').src = capturedImageData; document.getElementById('photoPreviewContainer').classList.remove('hidden'); calculate(); };
                r.readAsDataURL(f);
            }
        };
        document.getElementById('clearPhotoBtn').onclick = () => { capturedImageData = null; document.getElementById('photoPreviewContainer').classList.add('hidden'); calculate(); };

        document.getElementById('syncBtn').onclick = syncRates;
        document.getElementById('exportCsvBtn').onclick = () => {
            if(historyData.length===0) return;
            const h = ['Date','Time','Name','Foreign','Price','Profit'];
            const c = "data:text/csv;charset=utf-8," + h.join(",") + "\n" + historyData.map(i => [i.date,i.time,i.name,i.foreign,i.finalPrice,i.netProfit].join(",")).join("\n");
            const l = document.createElement("a"); l.href = encodeURI(c); l.download = `YU_ZZZ.csv`; l.click();
        };

        window.onload = () => { syncRates(); calculate(); };
    </script>
</body>
</html>
