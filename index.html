<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YU.ZZZ OFFICIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-gray: #F8F9FA;
            --soft-blue: #F0F7FF;
            --deep-black: #1A1A1A;
            --pure-white: #FFFFFF;
            --highlight-yellow: #FACC15;
            --list-yellow: #FFFBEB; 
            --brand-blue-grey: #5b7189;
            --item-border-yellow: #FEF3C7;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans TC", sans-serif; 
            background-color: var(--bg-gray); 
            color: var(--deep-black);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .color-brand-custom { color: var(--brand-blue-grey); }
        .bg-brand-custom { background-color: var(--brand-blue-grey); }
        .color-yellow-main { color: var(--highlight-yellow); }

        input::-webkit-outer-spin-button, 
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .detail-panel { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .history-card.expanded .detail-panel { max-height: 800px; }
        .history-card.expanded .chevron { transform: rotate(180deg); }
        
        .weight-btn.active {
            background-color: var(--brand-blue-grey) !important; 
            color: var(--pure-white) !important;
            border-color: var(--brand-blue-grey) !important;
        }
        
        .stat-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: white;
            border-radius: 10px;
            border: 1px solid var(--item-border-yellow);
            margin-bottom: 6px;
        }

        .list-container {
            background-color: var(--list-yellow);
            border-top: 1px solid #FEF3C7;
            box-shadow: 0 -10px 25px -5px rgba(251, 191, 36, 0.1);
        }

        #imageModal { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 20px; }
        
        .clear-search-btn {
            display: none;
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }
        #searchHistory:not(:placeholder-shown) + .clear-search-btn {
            display: block;
        }
        
        #quickResult { transition: opacity 0.3s ease, transform 0.3s ease; }
        #quickResult.hidden { display: none; opacity: 0; transform: translateY(10px); }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-md mx-auto min-h-screen flex flex-col relative">
        <!-- Dashboard Header -->
        <div class="p-6 pb-8 bg-[var(--pure-white)] sticky top-0 z-20 shadow-sm border-b border-gray-100 rounded-b-[2.5rem]">
            <div class="flex justify-between items-start mb-6">
                <div class="flex flex-col">
                    <h1 class="text-5xl font-black color-brand-custom italic tracking-tighter leading-none">YU.ZZZ</h1>
                    <span class="text-[10px] font-black text-black tracking-[0.3em] mt-1 ml-1 uppercase">Official｜2 0 0 2</span>
                </div>
                <div class="text-right flex flex-col justify-center">
                    <p class="text-[10px] text-gray-400 font-black uppercase tracking-widest text-[10px] mb-1 leading-none">Total Profit</p>
                    <p class="text-4xl font-black color-yellow-main italic leading-none tabular-nums">$<span id="totalProfit">0</span></p>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[var(--soft-blue)] p-3 rounded-2xl border border-blue-50">
                    <p class="text-[9px] text-blue-400 font-bold uppercase mb-1">Exchange Rate</p>
                    <div class="flex items-center justify-between">
                        <div class="flex flex-col">
                            <p id="currentRateDisplay" class="text-lg font-mono font-bold text-blue-900 leading-none">0.0240</p>
                            <p id="updateTime" class="text-[8px] text-blue-300 font-mono mt-1">Ready</p>
                        </div>
                        <button id="syncBtn" class="p-2 bg-white text-blue-600 rounded-xl active:scale-90 shadow-sm border border-blue-100">
                            <svg id="syncIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="bg-[var(--soft-blue)] p-3 rounded-2xl border border-blue-50">
                    <p class="text-[9px] text-blue-400 font-bold mb-1 uppercase">Bank Fee %</p>
                    <div class="flex items-center gap-1">
                        <input type="number" id="bankFeeInput" value="1.5" step="0.1" class="w-full bg-transparent text-lg font-black text-blue-900 leading-none outline-none">
                        <span class="text-lg font-black text-blue-900">%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Inputs Section -->
        <div class="px-6 py-5 space-y-5">
            <div class="grid grid-cols-3 gap-2.5">
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Currency</label>
                    <select id="currency" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none shadow-sm appearance-none">
                        <option value="KRW">KRW 🇰🇷</option>
                        <option value="JPY">JPY 🇯🇵</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Profit %</label>
                    <input type="number" id="profitPercent" value="10" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none shadow-sm">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Extra cost</label>
                    <input type="number" id="manualCost" value="0" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none shadow-sm">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[9px] font-black text-gray-400 uppercase ml-1 tracking-widest">Weight Range</label>
                <div class="grid grid-cols-2 gap-2" id="weightBtnContainer">
                    <button data-tier="0" data-label="2kg 以下" class="weight-btn active border bg-white p-3 rounded-xl text-[10px] font-black shadow-sm">2kg 以下 (+0)</button>
                    <button data-tier="2-5" data-label="2-5kg" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black shadow-sm">2-5kg (+60)</button>
                    <button data-tier="5-10" data-label="5-10kg" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black shadow-sm">5-10kg (+100)</button>
                    <button data-tier="10+" data-label="10kg+" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black shadow-sm">10kg+ (+150)</button>
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[9px] font-black text-gray-400 uppercase ml-1 tracking-widest">Product Info</label>
                <div class="flex gap-2.5">
                    <input type="text" id="itemName" placeholder="輸入產品名稱..." class="w-full p-4 bg-white border border-gray-200 rounded-xl text-sm font-bold outline-none shadow-sm">
                    <button id="cameraBtn" type="button" class="px-5 bg-brand-custom text-white rounded-xl active:scale-95 shadow-md flex items-center justify-center">
                        <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812-1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                    </button>
                    <input type="file" id="hiddenCameraInput" accept="image/*" capture="environment" class="hidden">
                </div>
                <div id="photoPreviewContainer" class="hidden flex justify-center pt-2">
                    <div class="relative">
                        <img id="photoPreviewImg" src="" class="w-24 h-24 object-cover rounded-2xl border-4 border-white shadow-xl">
                        <button id="clearPhotoBtn" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-lg">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Calculator Output -->
        <div class="px-6 pb-8 space-y-5">
            <div class="space-y-1">
                <label class="text-[10px] uppercase font-black text-gray-400 italic block pl-2 tracking-tighter">Local Original Price</label>
                <div class="relative">
                    <input type="text" inputmode="decimal" id="foreignPrice" placeholder="0" class="w-full p-6 pl-8 pr-24 text-5xl font-black rounded-[2rem] outline-none bg-white border border-gray-200 shadow-inner text-left tabular-nums text-gray-500">
                    <span id="priceSuffix" class="absolute right-8 top-1/2 -translate-y-1/2 font-black text-gray-200 text-2xl italic uppercase pointer-events-none">KRW</span>
                </div>
            </div>

            <div id="quickResult" class="hidden">
                <div class="bg-[var(--deep-black)] rounded-[2.5rem] p-7 text-white shadow-2xl relative overflow-hidden">
                    <div class="flex justify-between items-center mb-5">
                        <div class="min-w-0 pr-3">
                            <p class="text-[9px] text-yellow-400 font-bold uppercase tracking-widest">Suggested Price</p>
                            <p id="finalPrice" class="text-5xl font-black mt-1 tabular-nums text-white">$ 0</p>
                        </div>
                        <div class="text-right shrink-0 space-y-1.5">
                            <p class="text-[10px] font-bold text-red-400 italic flex items-center justify-end gap-1 uppercase">Fee: <span id="resExtra">-$0</span></p>
                            <p class="text-[10px] font-bold text-green-400 italic flex items-center justify-end gap-1 uppercase">Profit: <span id="resProfit">+$0</span></p>
                            <p class="text-[10px] font-bold text-gray-400 italic flex items-center justify-end gap-1 uppercase">Cost: <span id="resOriginal">+$0</span></p>
                        </div>
                    </div>
                    <button id="addToListBtn" class="w-full py-4 bg-yellow-400 hover:bg-yellow-300 text-black font-black text-lg rounded-2xl transition-all active:scale-95 uppercase tracking-widest shadow-lg h-14">ADD TO LIST</button>
                </div>
            </div>
        </div>

        <!-- History List -->
        <div class="list-container p-6 rounded-t-[3rem] flex-grow min-h-[400px]">
            <div class="flex items-center gap-3 mb-6 px-1">
                <div class="flex items-center gap-1.5 shrink-0">
                    <span class="w-3 h-3 bg-yellow-400 rounded-full"></span>
                    <h2 class="text-[10px] font-black text-amber-900/60 uppercase tracking-tighter italic whitespace-nowrap">LIST</h2>
                </div>
                
                <div class="relative flex-grow">
                    <input type="text" id="searchHistory" placeholder="Search..." class="w-full py-2 pl-8 pr-8 bg-white border border-amber-100 rounded-xl text-[10px] font-bold outline-none shadow-sm focus:border-amber-300 transition-colors">
                    <svg class="w-3 h-3 absolute left-3 top-1/2 -translate-y-1/2 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <button id="clearSearchBtn" class="clear-search-btn">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    </button>
                </div>
                
                <button id="exportCsvBtn" class="px-4 py-2 bg-white text-green-700 text-[10px] font-black rounded-xl border border-green-100 shadow-sm active:scale-90 transition-all shrink-0 uppercase">CSV</button>
            </div>

            <div id="historyList" class="space-y-4"></div>

            <div class="mt-12 mb-4 text-center">
                <p class="text-[10px] font-bold text-amber-900/20 tracking-[0.4em] uppercase">Y U . Z Z Z ™</p>
            </div>
        </div>
    </div>

    <div id="imageModal">
        <img id="fullImage" src="" class="max-w-full max-h-[85vh] rounded-[2rem] shadow-2xl">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'yu-zzz-official';

        let user = null;
        let historyData = [];
        let exchangeRates = { KRW: 0.0240, JPY: 0.210 };
        let currentWeightTier = "0";
        let currentWeightLabel = "2kg 以下";
        let capturedImageData = null;

        const taxRefundTable = [
            { min: 30000, max: 49999, refund: 1500 }, { min: 50000, max: 74999, refund: 3000 },
            { min: 75000, max: 99999, refund: 5000 }, { min: 100000, max: 124999, refund: 6000 },
            { min: 125000, max: 149999, refund: 8000 }, { min: 150000, max: 174999, refund: 9000 },
            { min: 175000, max: 199999, refund: 10000 }, { min: 200000, max: 224999, refund: 12000 },
            { min: 225000, max: 249999, refund: 13000 }, { min: 250000, max: 274999, refund: 15000 },
            { min: 275000, max: 299999, refund: 17000 }, { min: 300000, max: 499999, refund: 20000 },
            { min: 500000, max: 999999, refund: 35000 }
        ];

        async function initAuth() {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else { await signInAnonymously(auth); }
        }

        async function syncRates() {
            const icon = document.getElementById('syncIcon');
            icon?.classList.add('animate-spin');
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/TWD');
                const data = await res.json();
                if (data.result === 'success') {
                    exchangeRates.KRW = 1 / data.rates.KRW;
                    exchangeRates.JPY = 1 / data.rates.JPY;
                    document.getElementById('currentRateDisplay').innerText = (exchangeRates[document.getElementById('currency').value] || 0.024).toFixed(4);
                    document.getElementById('updateTime').innerText = `Updated ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})}`;
                }
            } catch (e) {}
            setTimeout(() => icon?.classList.remove('animate-spin'), 600);
        }

        function getTaxRefund(foreignPrice) {
            if (document.getElementById('currency').value !== 'KRW') return 0;
            const tier = taxRefundTable.find(t => foreignPrice >= t.min && foreignPrice <= t.max);
            return tier ? tier.refund : (foreignPrice >= 1000000 ? foreignPrice * 0.06 : 0);
        }

        function updatePricePreview() {
            const currency = document.getElementById('currency').value;
            const bankRate = exchangeRates[currency] || 0.024;
            const profitRate = (parseFloat(document.getElementById('profitPercent').value) || 0) / 100;
            const foreignPrice = parseFloat(document.getElementById('foreignPrice').value.replace(/,/g, '')) || 0;
            const manualCost = parseFloat(document.getElementById('manualCost').value) || 0;
            const feeRate = (parseFloat(document.getElementById('bankFeeInput').value) || 1.5) / 100;
            const resultBox = document.getElementById('quickResult');
            
            document.getElementById('priceSuffix').innerText = currency;
            if (foreignPrice > 0) { resultBox.classList.remove('hidden'); resultBox.style.display = 'block'; }
            else { resultBox.classList.add('hidden'); resultBox.style.display = 'none'; return null; }

            let weightExtra = 0;
            if (currentWeightTier === "2-5") weightExtra = 60;
            else if (currentWeightTier === "5-10") weightExtra = 100;
            else if (currentWeightTier === "10+") weightExtra = 150;

            const rawTwdCost = (foreignPrice * bankRate);
            const targetPrice = (rawTwdCost / (1 - feeRate - profitRate)) + weightExtra;
            const finalPrice = Math.round(targetPrice);
            const extraFee = Math.round(finalPrice * feeRate);
            const refundKrw = getTaxRefund(foreignPrice);
            const refundTwd = Math.round(refundKrw * bankRate);
            const netProfit = finalPrice - rawTwdCost - extraFee - manualCost + refundTwd;

            document.getElementById('resOriginal').innerText = `+$${Math.round(rawTwdCost).toLocaleString()}`;
            document.getElementById('resExtra').innerText = `-$${extraFee.toLocaleString()}`;
            document.getElementById('resProfit').innerText = `+$${Math.round(netProfit).toLocaleString()}`;
            document.getElementById('finalPrice').innerText = `$ ${finalPrice.toLocaleString()}`;

            const now = new Date();
            return {
                id: Date.now().toString(),
                date: `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`,
                time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
                name: document.getElementById('itemName').value || '未命名商品',
                image: capturedImageData,
                currency, foreign: foreignPrice, bankRate,
                rawTwdCost: Math.round(rawTwdCost), weightLabel: currentWeightLabel,
                weightTier: currentWeightTier,
                refundTwd, finalPrice, extraFee, netProfit, manualCost
            };
        }

        function getWeightColorClass(tier) {
            switch(tier) {
                case "0": return "bg-green-100 text-green-600";
                case "2-5": return "bg-yellow-100 text-yellow-600";
                case "5-10": return "bg-orange-100 text-orange-600";
                case "10+": return "bg-red-100 text-red-600";
                default: return "bg-blue-50 text-blue-500";
            }
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const search = (document.getElementById('searchHistory').value || '').toLowerCase();
            list.innerHTML = '';
            let total = 0;

            historyData.filter(i => (i.name||'').toLowerCase().includes(search)).forEach(item => {
                total += item.netProfit;
                const weightClass = getWeightColorClass(item.weightTier || "0");
                const el = document.createElement('div');
                el.className = 'history-card bg-white rounded-[2rem] shadow-sm border border-amber-100 overflow-hidden';
                el.innerHTML = `
                    <div class="p-5 flex items-center justify-between cursor-pointer card-header">
                        <div class="flex items-center gap-4 min-w-0">
                            <div class="chevron transition-transform text-amber-200">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                            </div>
                            <div class="min-w-0">
                                <h3 class="font-black text-black truncate text-[15px] tracking-tight mb-0.5">${item.name}</h3>
                                <p class="text-[10px] font-mono font-bold text-blue-500 leading-tight">
                                    ${item.foreign.toLocaleString()} ${item.currency} · RATE ${item.bankRate.toFixed(4)}
                                </p>
                                <p class="text-[9px] text-gray-400 font-bold block mt-1">${item.date} ${item.time}</p>
                            </div>
                        </div>
                        <div class="text-right flex items-center gap-4">
                            <div>
                                <p class="text-[18px] font-black text-gray-900 leading-none tabular-nums">$${item.finalPrice.toLocaleString()}</p>
                                <p class="text-[11px] text-green-600 font-black mt-1">+$${Math.round(item.netProfit).toLocaleString()}</p>
                            </div>
                            <button class="delete-btn p-2 text-gray-200 hover:text-red-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="detail-panel bg-gray-50/50 border-t border-gray-100">
                        <div class="p-6 flex gap-6">
                            <!-- Left: Image & Centered Name Info -->
                            <div class="w-32 shrink-0 flex flex-col items-center gap-3">
                                <div class="relative">
                                    ${item.image ? `<img src="${item.image}" class="detail-img w-32 h-32 rounded-2xl object-cover shadow-md border-2 border-white cursor-pointer">` : `<div class="w-32 h-32 bg-white rounded-2xl border border-dashed border-gray-200 flex items-center justify-center text-gray-300 text-[9px] font-bold uppercase">No Image</div>`}
                                </div>
                                <div class="w-full text-center">
                                    <div id="name-display-${item.id}" class="flex items-center justify-center gap-1 w-full px-1">
                                        <span class="text-xs font-black text-gray-800 truncate block">${item.name}</span>
                                        <button class="edit-name-btn p-1 text-amber-400 shrink-0"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"></path></svg></button>
                                    </div>
                                    <div id="name-edit-${item.id}" class="hidden flex gap-1 w-full justify-center px-1">
                                        <input type="text" value="${item.name}" class="edit-input-field w-full p-1 bg-white border border-blue-200 rounded text-[10px] font-bold min-w-0 text-center">
                                        <button class="save-name-btn text-blue-500 font-bold text-[9px] shrink-0">OK</button>
                                    </div>
                                </div>
                            </div>

                            <!-- Right: Stat Bars -->
                            <div class="flex-grow">
                                <div class="flex items-center justify-between mb-2">
                                    <label class="text-[8px] font-black text-gray-400 uppercase tracking-widest block">Calculation Detail</label>
                                    <span class="text-[9px] font-black px-2 py-0.5 rounded-md uppercase ${weightClass}">${item.weightLabel}</span>
                                </div>
                                <div class="stat-bar">
                                    <span class="text-[10px] font-black text-gray-700 uppercase">TWD</span>
                                    <span class="text-[11px] font-black text-gray-700">$${item.rawTwdCost.toLocaleString()}</span>
                                </div>
                                <div class="stat-bar">
                                    <span class="text-[10px] font-black text-red-400 uppercase">FEE</span>
                                    <span class="text-[11px] font-black text-red-400">-$${item.extraFee.toLocaleString()}</span>
                                </div>
                                <div class="stat-bar">
                                    <span class="text-[10px] font-black text-blue-400 uppercase">TAX</span>
                                    <span class="text-[11px] font-black text-blue-400">+$${item.refundTwd.toLocaleString()}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                el.querySelector('.card-header').onclick = (e) => { if(!e.target.closest('button')) el.classList.toggle('expanded'); };
                el.querySelector('.delete-btn').onclick = (e) => { e.stopPropagation(); if(user) deleteDoc(doc(db,'artifacts',appId,'public','data','history',item.id)); };
                if(item.image) el.querySelector('.detail-img').onclick = () => { document.getElementById('fullImage').src=item.image; document.getElementById('imageModal').style.display='flex'; };
                
                const disp = el.querySelector(`#name-display-${item.id}`);
                const edit = el.querySelector(`#name-edit-${item.id}`);
                const inp = el.querySelector('.edit-input-field');
                el.querySelector('.edit-name-btn').onclick = () => { disp.classList.add('hidden'); edit.classList.remove('hidden'); inp.focus(); };
                el.querySelector('.save-name-btn').onclick = () => { if(user) updateDoc(doc(db,'artifacts',appId,'public','data','history',item.id), {name: inp.value}); };

                list.appendChild(el);
            });
            document.getElementById('totalProfit').innerText = Math.round(total).toLocaleString();
        }

        window.onload = async () => { await initAuth(); syncRates(); };
        onAuthStateChanged(auth, (u) => {
            user = u;
            if(user) onSnapshot(collection(db,'artifacts',appId,'public','data','history'), (s) => {
                historyData = s.docs.map(d => d.data()).sort((a,b) => b.id - a.id);
                renderHistory();
            }, (err) => console.error(err));
        });

        ['foreignPrice','profitPercent','manualCost','bankFeeInput','currency'].forEach(id => {
            document.getElementById(id).addEventListener('input', updatePricePreview);
        });

        document.querySelectorAll('.weight-btn').forEach(btn => btn.onclick = () => {
            document.querySelectorAll('.weight-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); currentWeightTier = btn.dataset.tier; currentWeightLabel = btn.dataset.label;
            updatePricePreview();
        });

        document.getElementById('cameraBtn').onclick = () => document.getElementById('hiddenCameraInput').click();
        document.getElementById('hiddenCameraInput').onchange = (e) => {
            const f = e.target.files[0];
            if(f) {
                const r = new FileReader();
                r.onload = (re) => { capturedImageData = re.target.result; document.getElementById('photoPreviewImg').src = capturedImageData; document.getElementById('photoPreviewContainer').classList.remove('hidden'); };
                r.readAsDataURL(f);
            }
        };
        document.getElementById('clearPhotoBtn').onclick = () => { capturedImageData = null; document.getElementById('photoPreviewContainer').classList.add('hidden'); };

        document.getElementById('addToListBtn').onclick = async () => {
            const item = updatePricePreview();
            if(item && user) {
                await setDoc(doc(db,'artifacts',appId,'public','data','history',item.id), item);
                document.getElementById('foreignPrice').value = ''; document.getElementById('itemName').value = ''; capturedImageData = null;
                document.getElementById('photoPreviewContainer').classList.add('hidden'); document.getElementById('quickResult').classList.add('hidden');
            }
        };

        document.getElementById('searchHistory').oninput = renderHistory;
        document.getElementById('clearSearchBtn').onclick = () => { document.getElementById('searchHistory').value=''; renderHistory(); };
        document.getElementById('imageModal').onclick = () => document.getElementById('imageModal').style.display='none';
        document.getElementById('syncBtn').onclick = syncRates;
        document.getElementById('exportCsvBtn').onclick = () => {
            if(historyData.length===0) return;
            const headers = ['Date','Time','Name','Currency','Foreign','Rate','Cost','Price','Profit'];
            const content = "data:text/csv;charset=utf-8," + headers.join(",") + "\n" + historyData.map(i => [i.date,i.time,i.name,i.currency,i.foreign,i.bankRate.toFixed(4),i.rawTwdCost,i.finalPrice,i.netProfit].join(",")).join("\n");
            const link = document.createElement("a"); link.href = encodeURI(content); link.download = `YU_ZZZ_${new Date().toISOString().split('T')[0]}.csv`; link.click();
        };
    </script>
</body>
</html>
