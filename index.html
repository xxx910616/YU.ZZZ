<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YU.ZZZ OFFICIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-gray: #F8F9FA;
            --soft-blue: #F0F7FF;
            --deep-black: #1A1A1A;
            --pure-white: #FFFFFF;
            --highlight-yellow: #FACC15;
            --list-yellow: #FFFBEB; 
            --brand-blue-grey: #5b7189;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans TC", sans-serif; 
            background-color: var(--bg-gray); 
            color: var(--deep-black);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .color-brand-custom { color: var(--brand-blue-grey); }
        .bg-brand-custom { background-color: var(--brand-blue-grey); }
        .color-yellow-main { color: var(--highlight-yellow); }

        input::-webkit-outer-spin-button, 
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .detail-panel { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .history-card.expanded .detail-panel { max-height: 1000px; }
        .history-card.expanded .chevron { transform: rotate(180deg); }
        
        .weight-btn.active {
            background-color: var(--brand-blue-grey) !important; 
            color: var(--pure-white) !important;
            border-color: var(--brand-blue-grey) !important;
        }
        
        .stat-box {
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            height: 64px; 
            background: white;
            border-radius: 14px;
            border: 1px solid #fef3c7;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .list-container {
            background-color: var(--list-yellow);
            border-top: 1px solid #FEF3C7;
        }

        #imageModal { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        
        .clear-search-btn {
            display: none;
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }
        #searchHistory:not(:placeholder-shown) + .clear-search-btn {
            display: block;
        }

        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- 加載畫面 -->
    <div id="loadingOverlay">
        <h1 class="text-4xl font-black color-brand-custom italic tracking-tighter mb-4 animate-pulse">YU.ZZZ</h1>
        <div class="w-8 h-8 border-4 border-amber-400 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p id="loadingStatus" class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Initializing System...</p>
        <button id="forceEntryBtn" class="hidden mt-8 px-6 py-2 bg-gray-100 text-gray-500 text-[10px] font-bold rounded-full border border-gray-200 uppercase tracking-widest">跳過並進入</button>
    </div>

    <div class="max-w-md mx-auto min-h-screen flex flex-col relative">
        <!-- 頂部儀表板 -->
        <div class="p-6 pb-8 bg-[var(--pure-white)] sticky top-0 z-20 shadow-sm border-b border-gray-100 rounded-b-[2.5rem]">
            <div class="flex justify-between items-start mb-6">
                <div class="flex flex-col">
                    <h1 class="text-5xl font-black color-brand-custom italic tracking-tighter leading-none">YU.ZZZ</h1>
                    <span class="text-[10px] font-black text-black tracking-[0.3em] mt-1 ml-1 uppercase">Official｜2 0 0 2</span>
                </div>
                <div class="text-right flex flex-col justify-center">
                    <p class="text-[10px] text-gray-400 font-black uppercase tracking-widest leading-none mb-1">Total Profit</p>
                    <p class="text-4xl font-black color-yellow-main italic leading-none tabular-nums">$<span id="totalProfit">0</span></p>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[var(--soft-blue)] p-3 rounded-2xl border border-blue-50">
                    <p class="text-[9px] text-blue-400 font-bold uppercase mb-1">Exchange Rate</p>
                    <div class="flex items-center justify-between">
                        <div class="flex flex-col">
                            <p id="currentRateDisplay" class="text-lg font-mono font-bold text-blue-900 leading-none">0.0000</p>
                            <p id="updateTime" class="text-[8px] text-blue-300 font-mono mt-1">--:--</p>
                        </div>
                        <button id="syncBtn" class="p-2 bg-white text-blue-600 rounded-xl active:scale-90 shadow-sm border border-blue-100">
                            <svg id="syncIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="bg-[var(--soft-blue)] p-3 rounded-2xl border border-blue-50">
                    <p class="text-[9px] text-blue-400 font-bold mb-1 uppercase">Bank Fee %</p>
                    <div class="flex items-center gap-1">
                        <input type="number" id="bankFeeInput" value="1.5" step="0.1" class="w-full bg-transparent text-lg font-black text-blue-900 leading-none outline-none">
                        <span class="text-lg font-black text-blue-900">%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 輸入區域 -->
        <div class="px-6 py-5 space-y-5">
            <div class="grid grid-cols-3 gap-2.5">
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Currency</label>
                    <select id="currency" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none shadow-sm appearance-none">
                        <option value="KRW">KRW 🇰🇷</option>
                        <option value="JPY">JPY 🇯🇵</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Profit %</label>
                    <input type="number" id="profitPercent" value="10" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none shadow-sm">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Extra cost</label>
                    <input type="number" id="manualCost" value="0" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-xs font-bold outline-none shadow-sm">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[9px] font-black text-gray-400 uppercase ml-1 tracking-widest">Weight Range</label>
                <div class="grid grid-cols-2 gap-2" id="weightBtnContainer">
                    <button data-tier="0" data-label="2kg 以下" class="weight-btn active border bg-white p-3 rounded-xl text-[10px] font-black shadow-sm">2kg 以下 (+0)</button>
                    <button data-tier="2-5" data-label="2-5kg" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black shadow-sm">2-5kg (+60)</button>
                    <button data-tier="5-10" data-label="5-10kg" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black shadow-sm">5-10kg (+100)</button>
                    <button data-tier="10+" data-label="10kg+" class="weight-btn bg-white border border-gray-200 p-3 rounded-xl text-[10px] font-black shadow-sm">10kg+ (+150)</button>
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[9px] font-black text-gray-400 uppercase ml-1 tracking-widest">Product Info</label>
                <div class="flex gap-2.5">
                    <input type="text" id="itemName" placeholder="輸入產品名稱..." class="w-full p-4 bg-white border border-gray-200 rounded-xl text-sm font-bold outline-none shadow-sm">
                    <button id="cameraBtn" class="px-5 bg-brand-custom text-white rounded-xl active:scale-90 shadow-md flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812-1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                    </button>
                    <input type="file" id="hiddenCameraInput" accept="image/*" capture="environment" class="hidden">
                </div>
                <div id="photoPreviewContainer" class="hidden flex justify-center pt-2">
                    <div class="relative">
                        <img id="photoPreviewImg" src="" class="w-24 h-24 object-cover rounded-2xl border-4 border-white shadow-xl">
                        <button id="clearPhotoBtn" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-lg">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 計算結果顯示 -->
        <div class="px-6 pb-8 space-y-5">
            <div class="space-y-1">
                <label class="text-[10px] uppercase font-black text-gray-400 italic block pl-2 tracking-tighter">Local Original Price</label>
                <div class="relative">
                    <input type="number" id="foreignPrice" placeholder="0" class="w-full p-6 pl-8 pr-24 text-5xl font-black rounded-[2rem] outline-none bg-white border border-gray-200 shadow-inner text-left tabular-nums text-gray-500">
                    <span id="priceSuffix" class="absolute right-8 top-1/2 -translate-y-1/2 font-black text-gray-200 text-2xl italic uppercase pointer-events-none">KRW</span>
                </div>
            </div>

            <div id="quickResult" class="hidden">
                <div class="bg-[var(--deep-black)] rounded-[2.5rem] p-7 text-white shadow-2xl relative overflow-hidden">
                    <div class="flex justify-between items-center mb-5">
                        <div class="min-w-0 pr-3">
                            <p class="text-[9px] text-yellow-400 font-bold uppercase tracking-widest">Suggested Price</p>
                            <p id="finalPrice" class="text-5xl font-black mt-1 tabular-nums text-white">$ 0</p>
                        </div>
                        <div class="text-right shrink-0 space-y-1.5">
                            <p class="text-[10px] font-bold text-red-400 italic flex items-center justify-end gap-1 uppercase">Fee: <span id="resExtra">-$0</span></p>
                            <p class="text-[10px] font-bold text-green-400 italic flex items-center justify-end gap-1 uppercase">Profit: <span id="resProfit">+$0</span></p>
                            <p class="text-[10px] font-bold text-gray-400 italic flex items-center justify-end gap-1 uppercase">Cost: <span id="resOriginal">+$0</span></p>
                        </div>
                    </div>
                    <button id="addToListBtn" class="w-full py-4 bg-yellow-400 hover:bg-yellow-300 text-black font-black text-lg rounded-2xl transition-all active:scale-95 uppercase tracking-widest shadow-lg">ADD TO LIST</button>
                </div>
            </div>
        </div>

        <!-- 歷史清單 -->
        <div class="list-container p-6 rounded-t-[3rem] flex-grow min-h-[400px]">
            <div class="flex items-center gap-3 mb-6 px-1">
                <div class="flex items-center gap-1.5 shrink-0">
                    <span class="w-3 h-3 bg-yellow-400 rounded-full"></span>
                    <h2 class="text-[10px] font-black text-amber-900/60 uppercase tracking-tighter italic whitespace-nowrap">LIST</h2>
                </div>
                
                <div class="relative flex-grow">
                    <input type="text" id="searchHistory" placeholder="Search..." class="w-full py-2 pl-8 pr-8 bg-white border border-amber-100 rounded-xl text-[10px] font-bold outline-none shadow-sm focus:border-amber-300 transition-colors">
                    <svg class="w-3 h-3 absolute left-3 top-1/2 -translate-y-1/2 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <button id="clearSearchBtn" class="clear-search-btn">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    </button>
                </div>
                
                <button id="exportCsvBtn" class="px-4 py-2 bg-white text-green-700 text-[10px] font-black rounded-xl border border-green-100 shadow-sm active:scale-90 transition-all shrink-0 uppercase">CSV</button>
            </div>

            <div id="historyList" class="space-y-4"></div>

            <div class="mt-12 mb-4 text-center">
                <p class="text-[10px] font-bold text-amber-900/20 tracking-[0.4em] uppercase">Y U . Z Z Z ™</p>
            </div>
        </div>
    </div>

    <!-- 圖片彈窗 -->
    <div id="imageModal">
        <img id="fullImage" src="" class="max-w-full max-h-[85vh] rounded-[2rem] shadow-2xl">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 配置與初始化
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'yu-zzz-official';

        let user = null;
        let history = [];
        let exchangeRates = { KRW: 0.0240, JPY: 0.210 };
        let currentWeightTier = "0";
        let currentWeightLabel = "2kg 以下";
        let capturedImageData = null;
        let isUIReady = false;

        const taxRefundTable = [
            { min: 30000, max: 49999, refund: 1500 },
            { min: 50000, max: 74999, refund: 3000 },
            { min: 75000, max: 99999, refund: 5000 },
            { min: 100000, max: 124999, refund: 6000 },
            { min: 125000, max: 149999, refund: 8000 },
            { min: 150000, max: 174999, refund: 9000 },
            { min: 175000, max: 199999, refund: 10000 },
            { min: 200000, max: 224999, refund: 12000 },
            { min: 225000, max: 249999, refund: 13000 },
            { min: 250000, max: 274999, refund: 15000 },
            { min: 275000, max: 299999, refund: 17000 },
            { min: 300000, max: 499999, refund: 20000 },
            { min: 500000, max: 999999, refund: 35000 }
        ];

        // --- 性能優化：圖片壓縮 ---
        function compressImage(base64Str, maxWidth = 500) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > maxWidth) {
                        height = (maxWidth / width) * height;
                        width = maxWidth;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7)); // 0.7 質量 JPEG 大幅減小體積
                };
            });
        }

        // --- 認證邏輯 ---
        async function startApp() {
            const statusText = document.getElementById('loadingStatus');
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth Error", err);
                statusText.innerText = "Connection slow, retrying...";
                setTimeout(() => hideLoading(), 3000); // 強制進入防止死鎖
            }
        }

        function hideLoading() {
            if (isUIReady) return;
            isUIReady = true;
            const loader = document.getElementById('loadingOverlay');
            loader.style.transition = 'opacity 0.4s';
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 400);
        }

        // --- 匯率與計算 ---
        async function syncRates() {
            const icon = document.getElementById('syncIcon');
            if (icon) icon.classList.add('animate-spin');
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/TWD');
                const data = await res.json();
                if (data.result === 'success') {
                    exchangeRates.KRW = 1 / data.rates.KRW;
                    exchangeRates.JPY = 1 / data.rates.JPY;
                    document.getElementById('updateTime').innerText = `${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})}`;
                    updatePricePreview();
                }
            } catch (e) { console.warn("Rate sync failed, using default"); }
            if (icon) setTimeout(() => icon.classList.remove('animate-spin'), 600);
        }

        function getTaxRefund(foreignPrice) {
            if (document.getElementById('currency').value !== 'KRW') return 0;
            const tier = taxRefundTable.find(t => foreignPrice >= t.min && foreignPrice <= t.max);
            if (tier) return tier.refund;
            if (foreignPrice >= 1000000) return foreignPrice * 0.06;
            return 0;
        }

        function updatePricePreview() {
            const currency = document.getElementById('currency').value;
            const bankRate = exchangeRates[currency];
            const profitRate = (parseFloat(document.getElementById('profitPercent').value) || 0) / 100;
            const foreignPrice = parseFloat(document.getElementById('foreignPrice').value) || 0;
            const manualCostInput = parseFloat(document.getElementById('manualCost').value) || 0;
            const feeRate = (parseFloat(document.getElementById('bankFeeInput').value) || 1.5) / 100;
            
            let weightExtra = 0;
            if (currentWeightTier === "2-5") weightExtra = 60;
            else if (currentWeightTier === "5-10") weightExtra = 100;
            else if (currentWeightTier === "10+") weightExtra = 150;

            document.getElementById('priceSuffix').innerText = currency;
            document.getElementById('currentRateDisplay').innerText = bankRate.toFixed(4);

            if (foreignPrice <= 0) {
                document.getElementById('quickResult').classList.add('hidden');
                return null;
            }

            document.getElementById('quickResult').classList.remove('hidden');

            const rawTwdCost = (foreignPrice * bankRate);
            const targetPrice = (rawTwdCost / (1 - feeRate - profitRate)) + weightExtra;
            const finalPrice = Math.round(targetPrice);
            const extraFee = Math.round(finalPrice * feeRate);
            const refundKrw = getTaxRefund(foreignPrice);
            const refundTwd = Math.round(refundKrw * bankRate);
            const netProfit = finalPrice - rawTwdCost - extraFee - manualCostInput + refundTwd;

            document.getElementById('resOriginal').innerText = `+$${Math.round(rawTwdCost).toLocaleString()}`;
            document.getElementById('resExtra').innerText = `-$${extraFee.toLocaleString()}`;
            document.getElementById('resProfit').innerText = `+$${Math.round(netProfit).toLocaleString()}`;
            document.getElementById('finalPrice').innerText = `$ ${finalPrice.toLocaleString()}`;

            const now = new Date();
            return {
                id: Date.now().toString(),
                timestamp: now.getTime(),
                date: `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`,
                time: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
                name: document.getElementById('itemName').value || '未命名產品',
                image: capturedImageData,
                currency,
                foreign: foreignPrice,
                bankRate,
                rawTwdCost: Math.round(rawTwdCost),
                feeRate,
                weightExtra,
                weightLabel: currentWeightLabel,
                refundTwd,
                finalPrice: finalPrice,
                extraFee: extraFee,
                netProfit: netProfit,
                manualCostInput
            };
        }

        // --- UI 渲染 ---
        function renderHistory() {
            const list = document.getElementById('historyList');
            const search = document.getElementById('searchHistory').value.toLowerCase();
            list.innerHTML = '';
            let totalProfit = 0;

            const filtered = history.filter(i => i.name.toLowerCase().includes(search));

            filtered.forEach(item => {
                totalProfit += item.netProfit;
                const card = document.createElement('div');
                card.className = 'history-card bg-white rounded-[2rem] shadow-sm border border-amber-100 overflow-hidden';
                card.innerHTML = `
                    <div class="p-5 flex items-center justify-between cursor-pointer card-header">
                        <div class="flex items-center gap-4 min-w-0">
                            <div class="chevron transition-transform text-amber-200">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                            </div>
                            <div class="min-w-0">
                                <h3 class="font-black text-black truncate text-[15px] mb-0.5">${item.name}</h3>
                                <p class="text-[10px] font-mono font-bold text-blue-500">${item.foreign.toLocaleString()} ${item.currency} · ${item.bankRate.toFixed(4)}</p>
                                <p class="text-[9px] font-mono text-gray-300 mt-0.5">${item.date} ${item.time}</p>
                            </div>
                        </div>
                        <div class="text-right flex items-center gap-4">
                            <div>
                                <p class="text-[18px] font-black text-gray-900 tabular-nums">$${item.finalPrice.toLocaleString()}</p>
                                <p class="text-[11px] text-green-600 font-black">+$${Math.round(item.netProfit).toLocaleString()}</p>
                            </div>
                            <button class="delete-btn p-2 text-gray-200 hover:text-red-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div class="detail-panel bg-amber-50/40 border-t border-amber-50">
                        <div class="p-5 space-y-6">
                            <div class="flex gap-4 items-center">
                                ${item.image ? `<img src="${item.image}" class="detail-img w-24 h-24 rounded-2xl object-cover border-2 border-white shadow-sm shrink-0">` : `<div class="w-24 h-24 bg-white rounded-2xl border border-amber-50 flex items-center justify-center text-amber-100 text-[10px] font-bold shrink-0">NO IMG</div>`}
                                <div class="flex-grow min-w-0">
                                    <div class="flex items-center gap-2 mb-2">
                                        <span class="text-sm font-black text-gray-700 truncate">${item.name}</span>
                                    </div>
                                    <span class="text-[10px] font-black text-amber-600 bg-amber-100 px-2 py-0.5 rounded-full uppercase italic">${item.weightLabel}</span>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <div class="stat-box"><p class="text-[8px] text-gray-400 font-bold uppercase">Cost</p><p class="text-[11px] font-black text-gray-700">$${item.rawTwdCost.toLocaleString()}</p></div>
                                <div class="stat-box"><p class="text-[8px] text-red-300 font-bold uppercase">Fees</p><p class="text-[11px] font-black text-red-400">-$${item.extraFee.toLocaleString()}</p></div>
                                <div class="stat-box"><p class="text-[8px] text-blue-300 font-bold uppercase">Refund</p><p class="text-[11px] font-black text-blue-400">+$${item.refundTwd.toLocaleString()}</p></div>
                                <div class="stat-box !bg-green-50/30"><p class="text-[8px] text-green-400 font-black uppercase">Profit</p><p class="text-[11px] font-black text-green-600">+$${Math.round(item.netProfit).toLocaleString()}</p></div>
                            </div>
                        </div>
                    </div>
                `;

                card.querySelector('.card-header').onclick = (e) => {
                    if (!e.target.closest('button')) card.classList.toggle('expanded');
                };
                card.querySelector('.delete-btn').onclick = () => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'history', item.id));
                if (item.image) card.querySelector('.detail-img').onclick = () => {
                    document.getElementById('fullImage').src = item.image;
                    document.getElementById('imageModal').style.display = 'flex';
                };

                list.appendChild(card);
            });
            document.getElementById('totalProfit').innerText = Math.round(totalProfit).toLocaleString();
        }

        // --- 初始化監聽 ---
        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'history');
                onSnapshot(q, (snap) => {
                    history = snap.docs.map(d => d.data()).sort((a, b) => b.timestamp - a.timestamp);
                    renderHistory();
                    hideLoading(); // 收到第一次數據後關閉加載
                }, () => hideLoading());
            }
        });

        // 綁定事件
        document.getElementById('cameraBtn').onclick = () => document.getElementById('hiddenCameraInput').click();
        document.getElementById('hiddenCameraInput').onchange = async (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async (re) => {
                    const statusText = document.getElementById('loadingStatus'); // 複用 loading 文字顯示處理中
                    capturedImageData = await compressImage(re.target.result);
                    document.getElementById('photoPreviewImg').src = capturedImageData;
                    document.getElementById('photoPreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('addToListBtn').onclick = async () => {
            const item = updatePricePreview();
            if (item && user) {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'history', item.id), item);
                document.getElementById('foreignPrice').value = '';
                document.getElementById('itemName').value = '';
                capturedImageData = null;
                document.getElementById('photoPreviewContainer').classList.add('hidden');
                document.getElementById('quickResult').classList.add('hidden');
            }
        };

        document.getElementById('clearPhotoBtn').onclick = () => {
            capturedImageData = null;
            document.getElementById('photoPreviewContainer').classList.add('hidden');
        };

        ['foreignPrice', 'profitPercent', 'manualCost', 'bankFeeInput'].forEach(id => {
            document.getElementById(id).oninput = updatePricePreview;
        });
        document.getElementById('currency').onchange = updatePricePreview;
        document.getElementById('searchHistory').oninput = renderHistory;
        document.getElementById('clearSearchBtn').onclick = () => { document.getElementById('searchHistory').value = ''; renderHistory(); };
        document.getElementById('syncBtn').onclick = syncRates;
        document.getElementById('imageModal').onclick = () => document.getElementById('imageModal').style.display = 'none';
        document.getElementById('forceEntryBtn').onclick = () => hideLoading();

        document.querySelectorAll('.weight-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.weight-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentWeightTier = btn.dataset.tier;
                currentWeightLabel = btn.dataset.label;
                updatePricePreview();
            };
        });

        document.getElementById('exportCsvBtn').onclick = () => {
            const rows = history.map(i => [i.date, i.time, i.name, i.currency, i.foreign, i.bankRate.toFixed(4), i.finalPrice, i.netProfit]);
            const csv = "Date,Time,Name,Currency,Foreign,Rate,Final,Profit\n" + rows.map(r => r.join(",")).join("\n");
            const link = document.createElement("a");
            link.href = 'data:text/csv;charset=utf-8,\ufeff' + encodeURIComponent(csv);
            link.download = `YU_ZZZ_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        };

        // 啟動
        setTimeout(() => document.getElementById('forceEntryBtn').classList.remove('hidden'), 5000);
        startApp();
        syncRates();

    </script>
</body>
</html>
